<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wattwise</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* ── THEME TOKENS ────────────────────────────────────────────────────────── */
:root {
  --prod:    #f59e0b;
  --cons:    #22d3ee;
  --surplus: #34d399;
  --deficit: #f87171;
  --ev:      #a78bfa;
}

[data-theme="dark"] {
  --bg:      #0d0f12;
  --bg2:     #131619;
  --bg3:     #1a1e24;
  --border:  #252b33;
  --text:    #e2e8f0;
  --muted:   #64748b;
  --input-bg:#1a1e24;
  --shadow:  rgba(0,0,0,0.4);
}

[data-theme="light"] {
  --bg:      #f1f5f9;
  --bg2:     #ffffff;
  --bg3:     #f8fafc;
  --border:  #e2e8f0;
  --text:    #0f172a;
  --muted:   #94a3b8;
  --input-bg:#f1f5f9;
  --shadow:  rgba(0,0,0,0.08);
}

/* ── RESET ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  min-height: 100vh;
  transition: background 0.25s, color 0.25s;
}

/* ── HEADER ──────────────────────────────────────────────────────────────── */
header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  box-shadow: 0 1px 6px var(--shadow);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.logo-icon { font-size: 20px; }
.logo-text {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--prod);
}
.logo-sub {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* ── THEME TOGGLE ────────────────────────────────────────────────────────── */
.theme-switcher {
  display: flex;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
}

.theme-btn {
  padding: 7px 13px;
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  transition: background 0.15s, color 0.15s;
}

.theme-btn:hover { color: var(--text); }

.theme-btn.active {
  background: var(--border);
  color: var(--prod);
}

/* ── IMPORT BUTTON ───────────────────────────────────────────────────────── */
.import-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 7px 14px;
  border-radius: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
}
.import-btn:hover { border-color: var(--prod); color: var(--prod); }

/* ── DATE RANGE BAR ─────────────────────────────────────────────────────── */
.date-range-bar {
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  padding: 6px 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}
.date-range-bar input[type=date] {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  padding: 3px 7px;
  cursor: pointer;
}
.date-range-bar input[type=date]:focus { outline: none; border-color: var(--prod); }

/* ── STATUS BAR ──────────────────────────────────────────────────────────── */
.status-bar {
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  padding: 5px 24px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}
.status-bar b { color: var(--text); font-weight: 400; }

/* ── MAIN ────────────────────────────────────────────────────────────────── */
main {
  padding: 20px 24px 40px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  box-sizing: border-box;
}

/* ── SECTION LABEL ───────────────────────────────────────────────────────── */
.section-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}

/* ── STAT CARDS ──────────────────────────────────────────────────────────── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  max-width: 960px;
}

.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 1px 4px var(--shadow);
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: var(--card-accent, var(--border));
}
.card:hover {
  border-color: var(--card-accent, var(--border));
  box-shadow: 0 2px 10px var(--shadow);
}
.card-label {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 7px;
}
.card-value {
  font-size: 26px;
  font-weight: 700;
  line-height: 1;
  color: var(--card-accent, var(--text));
}
.card-unit {
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
  margin-left: 3px;
}
.card-sub {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  margin-top: 5px;
}

/* ── COMBINED CARD ROWS ──────────────────────────────────────────────────── */
.card-title {
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.card-row {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-rows: auto auto;
  align-items: baseline;
  gap: 0 6px;
  padding: 4px 0;
}
.card-row-label {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  grid-column: 1;
  grid-row: 1;
}
.card-row-value {
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
  grid-column: 2;
  grid-row: 1;
  white-space: nowrap;
}
.card-row-unit {
  font-size: 11px;
  font-weight: 400;
  color: var(--muted);
  margin-left: 2px;
}
.card-row-sub {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  grid-column: 1 / -1;
  grid-row: 2;
  margin-top: 1px;
}
.card-divider {
  height: 1px;
  background: var(--border);
  margin: 3px 0;
  opacity: 0.5;
}

/* ── SCATTER TOGGLES ─────────────────────────────────────────────────────── */
.toggle-group {
  display: flex;
  gap: 4px;
  align-items: center;
  flex-wrap: wrap;
}
.toggle-group-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  margin-right: 2px;
}
.tog {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.tog:hover { color: var(--text); border-color: var(--text); }
.tog.active { background: var(--border); color: var(--text); border-color: var(--text); }
.tog.active-prod  { border-color: var(--prod);    color: var(--prod);    background: var(--bg2); }
.tog.active-cons  { border-color: var(--cons);    color: var(--cons);    background: var(--bg2); }
.tog.active-ev    { border-color: var(--ev);      color: var(--ev);      background: var(--bg2); }
.tog.active-year  { border-color: var(--surplus); color: var(--surplus); background: var(--bg2); }
.year-chips {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 6px;
}

/* ── PANELS ──────────────────────────────────────────────────────────────── */
.panel {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 18px 20px;
  box-shadow: 0 1px 4px var(--shadow);
}
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
  flex-wrap: wrap;
  gap: 10px;
}
.panel-title {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text);
}
.chart-wrap {
  position: relative;
  width: 100%;
}

/* ── LEGEND ──────────────────────────────────────────────────────────────── */
.legend {
  display: flex;
  gap: 14px;
  font-size: 11px;
  letter-spacing: 1px;
  align-items: center;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
}
.legend-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── EV TOGGLE ───────────────────────────────────────────────────────────── */
.ev-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--muted);
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 10px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Share Tech Mono', monospace;
  user-select: none;
}
.ev-toggle:hover { border-color: var(--ev); color: var(--ev); }
.ev-toggle.active { border-color: var(--ev); color: var(--ev); background: var(--bg2); }
.ev-toggle .ev-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--ev);
  opacity: 0.4;
  transition: opacity 0.15s;
}
.ev-toggle.active .ev-dot { opacity: 1; }

/* ── ERROR BAR (monthly coverage) ────────────────────────────────────────── */
.month-bar-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.month-error-bar {
  position: absolute;
  width: 0;
  border-left: 1px solid var(--text);
  opacity: 0.45;
  top: 2px;
  bottom: 2px;
  transform: translateX(-50%);
}
.month-error-cap {
  position: absolute;
  height: 1px;
  background: var(--text);
  opacity: 0.35;
  border-radius: 0;
  transform: translateX(-50%);
  width: 5px;
}

/* ── MONTHLY BARS ────────────────────────────────────────────────────────── */
.monthly-grid {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
}
.month-row {
  display: grid;
  grid-template-columns: 36px 1fr 52px;
  align-items: center;
  gap: 8px;
}
.month-row .month-pct { font-size: 11px; }
.month-name { color: var(--muted); }
.month-bar-track {
  background: var(--bg3);
  border-radius: 2px;
  height: 13px;
  position: relative;
  overflow: hidden;
}
.month-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.5s ease;
}
.month-pct { text-align: right; color: var(--text); min-width: 46px; }

/* ── SCATTER + TREND ROW ─────────────────────────────────────────────────── */
.scatter-trend-row {
  display: grid;
  grid-template-columns: 3fr 2fr;
  gap: 16px;
  align-items: start;
}
.scatter-wrap { /* kept for legacy */ }
@media (max-width: 900px) {
  .scatter-trend-row { grid-template-columns: 1fr; }
}

/* ── TWO-COL LAYOUT (monthly + yoy side by side on wide screens) ─────────── */
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  align-items: stretch;
}
.two-col > * {
  min-width: 0;
}

/* ── MODAL ───────────────────────────────────────────────────────────────── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 28px 28px 24px;
  width: 100%;
  max-width: 460px;
  margin: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.modal h2 {
  font-size: 15px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 20px;
  color: var(--prod);
}
.form-group {
  margin-bottom: 14px;
}
.form-label {
  display: block;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 5px;
}
.form-label span {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1px;
}
.file-input-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  cursor: pointer;
  transition: border-color 0.2s;
}
.file-input-wrap:hover { border-color: var(--prod); }
.file-input-wrap.loaded { border-color: var(--surplus); }
.file-input-wrap input[type=file] { display: none; }
.file-name {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.file-input-wrap.loaded .file-name { color: var(--surplus); }
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  justify-content: flex-end;
}
.btn {
  padding: 8px 18px;
  border-radius: 4px;
  border: 1px solid var(--border);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-primary {
  background: var(--prod);
  border-color: var(--prod);
  color: #000;
  font-weight: 600;
}
.btn-primary:hover { opacity: 0.88; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-ghost {
  background: transparent;
  color: var(--muted);
}
.btn-ghost:hover { color: var(--text); border-color: var(--text); }
.import-status {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  margin-top: 10px;
  min-height: 16px;
  color: var(--muted);
}
.import-status.ok  { color: var(--surplus); }
.import-status.err { color: var(--deficit); }

/* ── EMPTY STATE ─────────────────────────────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--muted);
  text-align: center;
  gap: 12px;
}
.empty-state .icon { font-size: 44px; opacity: 0.3; }
.empty-state h2 { font-size: 17px; letter-spacing: 3px; text-transform: uppercase; }
.empty-state p { font-size: 13px; max-width: 360px; line-height: 1.6; }

/* ── CAROUSEL (mobile swipe) ─────────────────────────────────────────────── */
.carousel-track {
  display: flex;
  overflow-x: scroll;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  gap: 0;
  width: 100%;
}
.carousel-track::-webkit-scrollbar { display: none; }

.carousel-page {
  flex: 0 0 100%;
  scroll-snap-align: start;
  overflow-y: auto;
  padding: 12px;
  box-sizing: border-box;
  min-width: 0;
}

.carousel-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 10px 0 6px;
  flex-wrap: wrap;
}
.carousel-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border);
  border: none;
  cursor: pointer;
  padding: 0;
  transition: background 0.2s, transform 0.2s;
  flex-shrink: 0;
}
.carousel-dot.active {
  background: var(--prod);
  transform: scale(1.3);
}

/* ── RESPONSIVE ──────────────────────────────────────────────────────────── */
@media (max-width: 768px) {
  header { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
  .header-right { gap: 6px; }
  .import-btn { font-size: 11px; padding: 6px 9px; }
  .theme-btn  { padding: 6px 9px; font-size: 14px; }
  main { padding: 0; gap: 0; }          /* carousel handles layout */
  .carousel-page { padding: 12px; }
  .cards-grid { grid-template-columns: repeat(2, 1fr); }
  .scatter-trend-row { grid-template-columns: 1fr; }
  .chart-wrap { height: 240px !important; }
  .panel { padding: 12px 14px; }
  .section-label { font-size: 10px; letter-spacing: 2px; }
  .status-bar { font-size: 10px; gap: 12px; padding: 4px 14px; }
  .date-range-bar { padding: 5px 14px; }
}
@media (max-width: 540px) {
  .cards-grid { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr; }  /* no pairing on mobile */
  .chart-wrap { height: 220px !important; }
}
@media (max-width: 480px) {
  .cards-grid { grid-template-columns: 1fr; }
  .theme-switcher { display: none; }
  .status-bar { flex-wrap: wrap; }
}
/* ── SETTINGS PAGE ──────────────────────────────────────────────────────── */
.settings-page { padding: 24px; }
.settings-back { display: flex; align-items: center; gap: 8px; background: transparent; border: none; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 14px; letter-spacing: 1px; cursor: pointer; padding: 0 0 20px; transition: color 0.2s; }
.settings-back:hover { color: var(--prod); }
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.settings-grid-full { grid-column: 1 / -1; }
.settings-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 20px 24px; height: 100%; box-sizing: border-box; }
.settings-section-title { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--prod); margin-bottom: 16px; font-family: 'Share Tech Mono', monospace; }
.settings-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.settings-row:last-child { border-bottom: none; padding-bottom: 0; }
.settings-row-label { color: var(--muted); letter-spacing: 1px; font-size: 13px; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }
.settings-row-value { color: var(--text); font-family: 'Share Tech Mono', monospace; font-size: 14px; text-align: right; word-break: break-all; }
.settings-row-value.ok  { color: var(--surplus); }
.settings-row-value.err { color: var(--deficit); }
.settings-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.diag-result { margin-top: 12px; font-family: 'Share Tech Mono', monospace; font-size: 13px; color: var(--muted); line-height: 2; display: none; }
.diag-result.visible { display: block; }
@media (max-width: 700px) { .settings-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────────────────────── -->
<header>
  <div class="logo">
    <span class="logo-icon">⚡</span>
    <div>
      <div class="logo-text">Energy Monitor</div>
      <div class="logo-sub">SOLAR · CONSUMPTION · EV · NET</div>
    </div>
  </div>
  <div class="header-right">
    <div class="theme-switcher">
      <button class="theme-btn" data-mode="light" title="Light mode">☀</button>
      <button class="theme-btn" data-mode="system" title="Auto">⊙</button>
      <button class="theme-btn" data-mode="dark" title="Dark mode">☾</button>
    </div>
    <button class="import-btn" id="open-import">⬆ IMPORT DATA</button>
    <button class="import-btn" id="open-dashboard">⌂ DASHBOARD</button>
    <button class="import-btn" id="open-settings" style="position:relative;">⚙ SETTINGS<span id="conflict-badge" style="display:none;position:absolute;top:-4px;right:-4px;background:var(--deficit);color:#fff;border-radius:50%;min-width:16px;height:16px;font-size:9px;align-items:center;justify-content:center;font-family:monospace;padding:0 3px;" aria-label="unreviewed conflicts"></span></button>
  </div>
</header>

<!-- ── STATUS BAR ──────────────────────────────────────────────────────────── -->
<div class="status-bar">

        <span class="file-name" id="ev-name">No file selected</span>
        <input type="file" id="ev-file" accept=".csv">

    </div>

    <div class="import-status" id="import-status"></div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancel-import">CANCEL</button>

    </div>
  </div>
</div>

<!-- ── RESTORE MODAL ───────────────────────────────────────────────────────── -->
<div class="modal-overlay" id="restore-overlay">
  <div class="modal">
    <h2>⬆ Restore Database</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6;">
      Upload a <code>.db</code> backup file to replace the current database.<br>
      <span style="color:var(--deficit);">⚠ This will overwrite all current data.</span>

    <div class="form-group">
      <label class="form-label">Backup File <span>(.db)</span></label>
      <label class="file-input-wrap" id="restore-wrap">

        <span class="file-name" id="restore-name">No file selected</span>
        <input type="file" id="restore-file" accept=".db">
      </label>
    </div>
    <div class="import-status" id="restore-status"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancel-restore">CANCEL</button>

        style="background:var(--deficit);border-color:var(--deficit);color:#fff;">RESTORE</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ── UTILITY FUNCTIONS ────────────────────────────────────────────────────────
function cssVar(name) {
  return getComputedStyle(html).getPropertyValue(name).trim();
}

function chartDefaults() {
  // Use a softer grid color that works in both light and dark themes
  // --border in light is #e2e8f0 (too solid), in dark is #252b33 (fine)
  // We blend it with transparency to make grid lines subtle in all themes
  const borderHex = cssVar('--border').trim();
  return {
    color: cssVar('--muted'),
    grid:  borderHex,
    gridSoft: 'rgba(128,128,128,0.15)',  // consistent soft grid for all charts
  };
}

function tooltipStyle() {
  return {
    backgroundColor: cssVar('--bg3'),
    borderColor:     cssVar('--border'),
    borderWidth: 1,
    titleColor:  cssVar('--muted'),
    bodyColor:   cssVar('--text'),
    padding: 10,
  };
}

// ── THEME ─────────────────────────────────────────────────────────────────────
const html = document.documentElement;
const THEME_KEY = 'wattwise_theme';
let systemDark = window.matchMedia('(prefers-color-scheme: dark)');

function applyTheme(mode) {
  const resolved = mode === 'system' ? (systemDark.matches ? 'dark' : 'light') : mode;
  html.setAttribute('data-theme', resolved);
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  // Refresh charts if rendered
  if (window._charts) {
    Object.values(window._charts).forEach(c => {
      if (!c) return;
      // Update zero-line dataset color (trend chart)
      if (c.data && c.data.datasets) {
        c.data.datasets.forEach(ds => {
          if (ds.label === 'Zero') ds.borderColor = cssVar('--muted');
        });
      }
      updateChartTheme(c);
      c.update();
    });
  }
}

function updateChartTheme(chart) {
  if (!chart || !chart.options) return;
  const muted  = getComputedStyle(html).getPropertyValue('--muted').trim();
  const border = getComputedStyle(html).getPropertyValue('--border').trim();
  if (chart.options.scales) {
    Object.values(chart.options.scales).forEach(axis => {
      if (!axis) return;
      if (axis.ticks)  axis.ticks.color  = muted;
      if (axis.grid)   axis.grid.color   = border;
      if (axis.border) axis.border.color = border;
    });
  }
  // Re-apply annotation zero line color if present (trend chart)
  if (chart.options.plugins?.annotation?.annotations?.zeroLine) {
    chart.options.plugins.annotation.annotations.zeroLine.borderColor = muted;
  }
}

document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.mode;
    localStorage.setItem(THEME_KEY, mode);
    applyTheme(mode);
  });
});

systemDark.addEventListener('change', () => {
  if ((localStorage.getItem(THEME_KEY) || 'system') === 'system') applyTheme('system');
});

applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

// ── GLOBAL DATA FLAGS ───────────────────────────────────────────────────────────
window._hasInterval = false;
window._hasEV       = false;

// ── DASHBOARD PREFS (S-04) ───────────────────────────────────────────────────
const PREFS_KEY = 'wattwise_prefs';
const SECTIONS  = [
  { key: 'cards',    label: 'Stat Cards',                    half: false },
  { key: 'scatter',  label: 'Prod vs Cons Scatter',          half: false },
  { key: 'trend',    label: 'Net Energy Trend (30d)',         half: true  },
  { key: 'dow',      label: 'Day-of-Week Consumption',       half: true  },
  { key: 'myoy',     label: 'Monthly + Year-over-Year',      half: false },
  { key: 'solar',    label: 'Solar Fingerprint',             half: false, requiresInterval: true },
  { key: 'interval', label: 'Interval Analytics (15-min)',   half: false, requiresInterval: true, defaultOff: true },
];
const SECTION_MAP = Object.fromEntries(SECTIONS.map(s => [s.key, s]));

function _loadPrefs() {
  try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch(_) { return {}; }
}

function _sectionVisible(key) {
  const p = _loadPrefs();
  if (p[key] !== undefined) return p[key] !== false;
  // If not in prefs yet, use defaultOff from SECTIONS registry
  const sec = SECTION_MAP[key];
  return !sec?.defaultOff;
}

function _getSectionOrder() {
  const p = _loadPrefs();
  let saved = p.order;
  const defaultOrder = SECTIONS.map(s => s.key);
  if (!saved || !Array.isArray(saved)) return defaultOrder;
  // Migrate old monthly/yoy keys to myoy
  const hasMYoY = saved.includes('myoy');
  if (!hasMYoY) {
    const idx = saved.indexOf('monthly');
    if (idx >= 0) { saved = [...saved]; saved.splice(idx, 1, 'myoy'); }
    saved = saved.filter(k => k !== 'yoy');
  }
  // Merge: saved order + any new keys not yet in saved
  const known = new Set(saved);
  const extra = defaultOrder.filter(k => !known.has(k));
  return [...saved.filter(k => SECTION_MAP[k]), ...extra];
}

function _savePrefs(visMap, order) {
  const p = _loadPrefs();
  Object.assign(p, visMap);
  if (order) p.order = order;
  localStorage.setItem(PREFS_KEY, JSON.stringify(p));
}

// ── CHART REGISTRY ────────────────────────────────────────────────────────────
window._charts = { scatter: null, monthly: null, yoy: null, trend: null };

// ── DATE RANGE STATE ──────────────────────────────────────────────────────────
let _drFrom = null;   // ISO string or null (null = use API default)
let _drTo   = null;

function _drBuildQuery() {
  const params = [];
  if (_drFrom) params.push(`from_date=${_drFrom}`);
  if (_drTo)   params.push(`to_date=${_drTo}`);
  return params.length ? '?' + params.join('&') : '';
}

// Date range controls wired inside renderCards

// ── CHART HELPERS ─────────────────────────────────────────────────────────────
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_DOYS = [1,32,60,91,121,152,182,213,244,274,305,335];



// ── MODAL ─────────────────────────────────────────────────────────────────────
const overlay    = document.getElementById('modal-overlay');
const doImportBtn = document.getElementById('do-import');
const statusEl   = document.getElementById('import-status');

document.getElementById('open-import').addEventListener('click', () => {
  overlay.classList.add('open');
  statusEl.textContent = '';
  statusEl.className = 'import-status';
});
document.getElementById('cancel-import').addEventListener('click', () => {
  overlay.classList.remove('open');
  resetImportModal();
});
overlay.addEventListener('click', e => { if (e.target === overlay) { overlay.classList.remove('open'); resetImportModal(); } });

// ── RESTORE MODAL ─────────────────────────────────────────────────────────────
const restoreOverlay  = document.getElementById('restore-overlay');
const doRestoreBtn    = document.getElementById('do-restore');
const restoreStatusEl = document.getElementById('restore-status');


document.getElementById('cancel-restore').addEventListener('click', () => {
  restoreOverlay.classList.remove('open');
});
restoreOverlay.addEventListener('click', e => { if (e.target === restoreOverlay) restoreOverlay.classList.remove('open'); });

const restoreInput = document.getElementById('restore-file');
restoreInput.addEventListener('change', () => {
  const f = restoreInput.files[0];
  document.getElementById('restore-name').textContent = f ? f.name : 'No file selected';
  document.getElementById('restore-wrap').classList.toggle('loaded', !!f);
  doRestoreBtn.disabled = !f;
});

doRestoreBtn.addEventListener('click', async () => {
  const f = restoreInput.files[0];
  if (!f) return;
  if (!confirm('This will overwrite the current database with the selected backup. Are you sure?')) return;

  const fd = new FormData();
  fd.append('db_file', f);

  doRestoreBtn.disabled = true;
  restoreStatusEl.className = 'import-status';
  restoreStatusEl.textContent = 'RESTORING…';

  try {
    const res = await fetch('/api/restore', { method: 'POST', body: fd });
    const parsed = await res.json().catch(() => null);
    if (res.ok && parsed?.success) {
      restoreStatusEl.textContent = '✓ Restore successful — reloading…';
      restoreStatusEl.className = 'import-status ok';
      setTimeout(() => {
        restoreOverlay.classList.remove('open');
        loadDashboard();
      }, 1200);
    } else {
      const detail = parsed?.detail || 'Restore failed';
      restoreStatusEl.textContent = `✗ ${detail}`;
      restoreStatusEl.className = 'import-status err';
      doRestoreBtn.disabled = false;
    }
  } catch (e) {
    restoreStatusEl.textContent = '✗ Network error — is the server running?';
    restoreStatusEl.className = 'import-status err';
    doRestoreBtn.disabled = false;
  }
});

function wireFileInput(inputId, nameId, wrapId) {
  const input = document.getElementById(inputId);
  const name  = document.getElementById(nameId);
  const wrap  = document.getElementById(wrapId);
  input.addEventListener('change', () => {
    if (input.files[0]) {
      name.textContent = input.files[0].name;
      wrap.classList.add('loaded');
    } else {
      name.textContent = 'No file selected';
      wrap.classList.remove('loaded');
    }
    checkImportReady();
  });
}

wireFileInput('prod-file',     'prod-name',     'prod-wrap');
wireFileInput('cons-file',     'cons-name',     'cons-wrap');
wireFileInput('interval-file', 'interval-name', 'interval-wrap');
wireFileInput('ev-file',       'ev-name',       'ev-wrap');

let _importMode = 'daily';  // 'daily' | 'interval'

function resetImportModal() {
  [['prod-file','prod-name','prod-wrap'],
   ['cons-file','cons-name','cons-wrap'],
   ['interval-file','interval-name','interval-wrap'],
   ['ev-file',  'ev-name',  'ev-wrap']].forEach(([inputId, nameId, wrapId]) => {
    const input = document.getElementById(inputId);
    const name  = document.getElementById(nameId);
    const wrap  = document.getElementById(wrapId);
    if (!input) return;
    input.value = '';
    name.textContent = 'No file selected';
    wrap.classList.remove('loaded');
  });
  doImportBtn.disabled = true;
  statusEl.textContent = '';
  statusEl.className = 'import-status';
}

// Mode toggle wiring
document.getElementById('mode-daily').addEventListener('click', () => {
  _importMode = 'daily';
  document.getElementById('import-daily-fields').style.display = '';
  document.getElementById('import-interval-fields').style.display = 'none';
  document.getElementById('mode-daily').classList.add('active');
  document.getElementById('mode-interval').classList.remove('active');
  checkImportReady();
});
document.getElementById('mode-interval').addEventListener('click', () => {
  _importMode = 'interval';
  document.getElementById('import-daily-fields').style.display = 'none';
  document.getElementById('import-interval-fields').style.display = '';
  document.getElementById('mode-daily').classList.remove('active');
  document.getElementById('mode-interval').classList.add('active');
  checkImportReady();
});

function checkImportReady() {
  const prod     = document.getElementById('prod-file').files[0];
  const cons     = document.getElementById('cons-file').files[0];
  const ev       = document.getElementById('ev-file').files[0];
  const interval = document.getElementById('interval-file').files[0];
  if (_importMode === 'interval') {
    doImportBtn.disabled = !(interval || ev);
  } else {
    doImportBtn.disabled = !(prod || cons || ev);
  }
}

doImportBtn.addEventListener('click', async () => {
  const prod = document.getElementById('prod-file').files[0];
  const cons = document.getElementById('cons-file').files[0];
  const ev   = document.getElementById('ev-file').files[0];

  const interval = document.getElementById('interval-file').files[0];
  const fd = new FormData();
  if (_importMode === 'interval') {
    if (interval) fd.append('interval_file', interval);
  } else {
    if (prod) fd.append('prod_file', prod);
    if (cons) fd.append('cons_file', cons);
  }
  if (ev) fd.append('ev_file', ev);

  doImportBtn.disabled = true;
  statusEl.className = 'import-status';
  statusEl.textContent = 'UPLOADING…';

  try {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/import');
    xhr.onload = () => {
      // Safely parse — server may return plain text on early crashes
      let parsed = null;
      try { parsed = JSON.parse(xhr.responseText); } catch (_) {}

      if (xhr.status === 200 && parsed) {
        const ev  = parsed.ev_included ? ' (EV included)' : '';
        const msg = `✓ ${parsed.inserted} new, ${parsed.updated} updated, ${parsed.skipped} skipped${ev}`;
        statusEl.textContent = msg;
        statusEl.className = 'import-status ok';
        setTimeout(() => {
          overlay.classList.remove('open');
          resetImportModal();
          loadDashboard();
        }, 1200);
      } else {
        const detail = parsed?.detail || xhr.responseText || 'Import failed';
        statusEl.textContent = `✗ ${detail}`;
        statusEl.className = 'import-status err';
        doImportBtn.disabled = false;
      }
    };
    xhr.onerror = () => {
      statusEl.textContent = '✗ Network error — is the server running?';
      statusEl.className = 'import-status err';
      doImportBtn.disabled = false;
    };
    xhr.send(fd);
  } catch (e) {
    statusEl.textContent = '✗ ' + e.message;
    statusEl.className = 'import-status err';
    doImportBtn.disabled = false;
  }
});

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
async function loadDashboard() {
  // Always fetch version — shows even when DB is empty
  try {
    const vRes = await fetch('/api/version');
    if (vRes.ok) {
      const v = await vRes.json();
      document.getElementById('sb-be').textContent = v.be;
      document.getElementById('sb-fe').textContent = v.fe;
    }
  } catch(_) {}

  try {
    const drQ = _drBuildQuery();
    const [summaryRes, dailyRes, monthlyRes] = await Promise.all([
      fetch(`/api/summary${drQ}`),
      fetch(`/api/daily${drQ}`),
      fetch(`/api/monthly${drQ}`),
    ]);

    // If any API route returned non-2xx, log the status and show empty state
    for (const [name, res] of [['summary', summaryRes], ['daily', dailyRes], ['monthly', monthlyRes]]) {
      if (!res.ok) {
        const body = await res.text();
        console.error(`/api/${name} returned ${res.status}:`, body);
        renderEmpty();
        return;
      }
    }

    const [summary, daily, monthly] = await Promise.all([
      summaryRes.json(),
      dailyRes.json(),
      monthlyRes.json(),
    ]);

    // Empty database — show prompt to import, no warning needed
    if (!daily || daily.length === 0 || !summary || summary.total_days === 0) {
      renderEmpty();
      return;
    }

    const hasEV = (summary.total_ev || 0) > 0 || (summary.total_ev_sessions || 0) > 0;
    updateStatusBar(summary, daily);
    updateConflictBadge();

    const hasInterval = daily.some(r => r.data_source === 'interval');
    window._hasInterval = hasInterval;
    window._hasEV       = hasEV;

    // Render sections in user-defined order, pairing adjacent half-width sections
    const orderedKeys = _getSectionOrder();
    const visibleSecs = orderedKeys.filter(k => {
      if (!_sectionVisible(k)) return false;
      if (SECTION_MAP[k]?.requiresInterval && !hasInterval) return false;
      return true;
    });

    // Each render fn appends directly to main; after render we move half-width
    // panels into two-col pairs based on order
    const _renderFns = {
      cards:    () => renderCards(summary, hasEV),
      scatter:  () => renderScatter(daily, hasEV),
      trend:    () => renderTrend(daily),
      myoy:     () => renderMonthlyAndYoY(monthly, daily, hasEV),
      dow:      () => renderDOW(hasEV),
      solar:    () => renderSolarFingerprint(daily),
      interval: () => renderIntervalDashboards(hasEV),
    };

    const mainEl = document.getElementById('main');

    // Render each visible section, then post-process to pair half-width sections
    // We snapshot main.children before each render to find new nodes added
    // Must await async render functions so nodes are in DOM before tagging
    for (const key of visibleSecs) {
      const before = mainEl.children.length;
      await (_renderFns[key]?.());
      // Tag newly added root nodes with the section key
      for (let j = before; j < mainEl.children.length; j++) {
        mainEl.children[j].dataset.sectionKey = key;
      }
    }

    // ── Layout: desktop vs tablet vs mobile ─────────────────────────────────
    const W = window.innerWidth;
    const isMobile = W <= 540;
    const isTablet = W > 540 && W <= 768;
    const isDesktop = W > 768;

    const allNodes = Array.from(mainEl.children);

    if (isDesktop) {
      // Desktop: pair adjacent half-width sections into two-col rows
      let pi = 0;
      while (true) {
        const children = Array.from(mainEl.children);
        if (pi >= children.length) break;
        const node    = children[pi];
        const nodeKey = node.dataset.sectionKey;
        const nodeSec = SECTION_MAP[nodeKey];
        if (!nodeSec) { pi++; continue; }
        let ni = pi + 1;
        while (ni < children.length && !SECTION_MAP[children[ni].dataset.sectionKey]) ni++;
        const nextNode = children[ni];
        const nextKey  = nextNode?.dataset.sectionKey;
        const nextSec  = SECTION_MAP[nextKey];
        if (nodeSec.half && nextSec?.half) {
          const row = document.createElement('div');
          row.className = 'two-col';
          row.dataset.pairRow = nodeKey + '+' + nextKey;
          mainEl.insertBefore(row, node);
          row.appendChild(node);
          row.appendChild(nextNode);
          continue;
        }
        pi++;
      }
    } else {
      // Mobile/Tablet: build carousel
      // Collect pages: on tablet pair halves, on mobile all separate
      const pages = [];
      let pi = 0;
      while (pi < allNodes.length) {
        const node    = allNodes[pi];
        const nodeKey = node.dataset.sectionKey;
        const nodeSec = SECTION_MAP[nodeKey];
        const nextNode = allNodes[pi + 1];
        const nextKey  = nextNode?.dataset.sectionKey;
        const nextSec  = SECTION_MAP[nextKey];

        if (isTablet && nodeSec?.half && nextSec?.half) {
          // Pair on tablet
          pages.push([node, nextNode]);
          pi += 2;
        } else {
          pages.push([node]);
          pi++;
        }
      }

      // Build carousel DOM
      const track = document.createElement('div');
      track.className = 'carousel-track';
      track.id = 'carousel-track';

      pages.forEach((pageNodes, idx) => {
        const page = document.createElement('div');
        page.className = 'carousel-page';
        page.dataset.pageIdx = idx;
        if (pageNodes.length === 2) {
          // Paired — wrap in two-col
          const pair = document.createElement('div');
          pair.className = 'two-col';
          pair.style.gridTemplateColumns = '1fr 1fr';
          pageNodes.forEach(n => pair.appendChild(n));
          page.appendChild(pair);
        } else {
          page.appendChild(pageNodes[0]);
        }
        track.appendChild(page);
      });

      mainEl.appendChild(track);

      // Dot indicators
      const dotsEl = document.createElement('div');
      dotsEl.className = 'carousel-dots';
      dotsEl.id = 'carousel-dots';
      pages.forEach((_, idx) => {
        const dot = document.createElement('button');
        dot.className = 'carousel-dot' + (idx === 0 ? ' active' : '');
        dot.dataset.page = idx;
        dot.setAttribute('aria-label', 'Page ' + (idx + 1));
        dot.addEventListener('click', () => {
          const pg = track.children[idx];
          if (pg) track.scrollTo({ left: pg.offsetLeft, behavior: 'smooth' });
        });
        dotsEl.appendChild(dot);
      });
      mainEl.appendChild(dotsEl);

      // Sync dots on scroll
      const dots = dotsEl.querySelectorAll('.carousel-dot');
      track.addEventListener('scroll', () => {
        const pageW = track.clientWidth;
        const cur   = Math.round(track.scrollLeft / pageW);
        dots.forEach((d, i) => d.classList.toggle('active', i === cur));
      }, { passive: true });
    }
  } catch (e) {
    console.error('Dashboard load failed:', e);
    // Surface error visibly so we can diagnose in production
    const main = document.getElementById('main');
    if (main) main.innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠</div>
        <h2>Render Error</h2>
        <p style="font-family:monospace;font-size:11px;color:var(--deficit);max-width:600px;word-break:break-all;">
          ${e.message}<br><br>${(e.stack||'').split('\n').slice(0,4).join('<br>')}
        </p>
      </div>`;
  }
}

// ── ONBOARDING WIZARD ────────────────────────────────────────────────────────

    back.onclick = () => _renderWizard('battery');
    next.onclick = async () => {
      next.disabled = true; next.textContent = 'SAVING…';

          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({..._wizData, setup_complete: '1'}),
        });
        _renderWizard('done');
      } catch(e) {
        next.disabled = false; next.textContent = 'FINISH SETUP →';
        alert('Error saving setup: ' + e.message);

  } else if (step === 'done') {

  }
}

function updateStatusBar(summary, daily) {

  document.getElementById('sb-records').textContent  = `${summary.total_days} days`;

    ? lastImport.replace('T', ' ').replace('Z', '') + ' UTC'

// ── STAT CARDS (4 combined cards) ────────────────────────────────────────────
function renderCards(s, hasEV = true) {
  const net   = s.total_net || 0;
  const isPos = net >= 0;
  const surplusPct = s.total_days ? ((s.surplus_days / s.total_days) * 100).toFixed(0) : 0;

  // Each card: { title, accent, rows: [{label, value, unit, sub?}] }
  const cards = [
    {
      title: 'Solar Production', accent: 'var(--prod)',
      rows: [
        { label: 'Total',     value: ((s.total_prod||0)/1000).toFixed(2), unit: 'MWh' },
        { label: 'Best Day',  value: (s.best_prod_kwh||0).toFixed(1),     unit: 'kWh', sub: s.best_prod_date || '—' },
        { label: 'Avg Daily', value: (s.avg_daily_prod||0).toFixed(1),    unit: 'kWh' },
      ],
    },
    {
      title: 'Consumption', accent: 'var(--cons)',
      rows: [
        { label: 'Total',     value: ((s.total_cons||0)/1000).toFixed(2), unit: 'MWh' },
        { label: 'Peak Day',  value: (s.peak_cons_kwh||0).toFixed(1),     unit: 'kWh', sub: s.peak_cons_date || '—' },
        { label: 'Avg Daily', value: (s.avg_daily_cons||0).toFixed(1),    unit: 'kWh' },
      ],
    },
    {
      title: 'Energy Balance', accent: isPos ? 'var(--surplus)' : 'var(--deficit)',
      rows: [
        { label: isPos ? 'Net Surplus' : 'Net Deficit',
          value: Math.abs(net).toFixed(0), unit: 'kWh',
          sub: `${Math.abs(net/1000).toFixed(2)} MWh ${isPos ? 'exported' : 'imported'}` },
        { label: 'Self-Sufficiency', value: (s.self_suff_pct||0).toFixed(1), unit: '%' },
        { label: 'Surplus Days',     value: s.surplus_days||0, unit: '', sub: `${surplusPct}% of ${s.total_days||0} days` },
      ],
    },
    ...(hasEV ? [{
      title: 'EV & House Load', accent: 'var(--ev)',
      rows: [
        { label: 'EV Total',    value: ((s.total_ev||0)/1000).toFixed(2),    unit: 'MWh', sub: `${s.total_ev_sessions||0} sessions` },
        { label: 'House Load',  value: ((s.total_house||0)/1000).toFixed(2), unit: 'MWh', sub: 'excl. EV' },
      ],
    }] : []),
  ];

  const main = document.getElementById('main');
  main.innerHTML = '';

  const sec = document.createElement('div');
  sec.innerHTML = '<div class="section-label">// METRICS OVER TIME</div>';
  // Compact date range bar for stat cards
  const drBar = document.createElement('div');
  drBar.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-family:"Share Tech Mono",monospace;font-size:11px;color:var(--muted);';
  const _mono = 'font-family:monospace;';
  drBar.innerHTML =
    '<span>FROM:</span>' +
    '<input type="date" id="dr-from" style="background:var(--bg2);border:1px solid var(--border);border-radius:3px;color:var(--text);' + _mono + 'font-size:11px;padding:3px 7px;">' +
    '<span>TO:</span>' +
    '<input type="date" id="dr-to"   style="background:var(--bg2);border:1px solid var(--border);border-radius:3px;color:var(--text);' + _mono + 'font-size:11px;padding:3px 7px;">' +
    '<button id="dr-apply" style="background:var(--bg3);border:1px solid var(--prod);border-radius:3px;color:var(--prod);' + _mono + 'font-size:10px;padding:3px 7px;cursor:pointer;letter-spacing:1px;">APPLY</button>' +
    '<button id="dr-clear" style="background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--muted);' + _mono + 'font-size:10px;padding:3px 7px;cursor:pointer;letter-spacing:1px;">CLEAR</button>';
  sec.appendChild(drBar);

  // Restore saved date inputs and wire events
  const drFrom = drBar.querySelector('#dr-from');
  const drTo   = drBar.querySelector('#dr-to');
  if (_drFrom) drFrom.value = _drFrom;
  if (_drTo)   drTo.value   = _drTo;
  drBar.querySelector('#dr-apply').addEventListener('click', () => {
    _drFrom = drFrom.value || null;
    _drTo   = drTo.value   || null;
    loadDashboard();
  });
  drBar.querySelector('#dr-clear').addEventListener('click', () => {
    _drFrom = null; _drTo = null;
    drFrom.value = ''; drTo.value = '';
    loadDashboard();
  });

  const grid = document.createElement('div');
  grid.className = 'cards-grid';

  cards.forEach(c => {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.setProperty('--card-accent', c.accent);

    const rowsHtml = c.rows.map(r => `
      <div class="card-row">
        <span class="card-row-label">${r.label}</span>
        <span class="card-row-value" style="color:${c.accent}">${r.value}<span class="card-row-unit">${r.unit}</span></span>
        ${r.sub ? `<span class="card-row-sub">${r.sub}</span>` : ''}
      </div>`).join('<div class="card-divider"></div>');

    el.innerHTML = `
      <div class="card-title">${c.title}</div>
      ${rowsHtml}`;
    grid.appendChild(el);
  });

  sec.appendChild(grid);
  main.appendChild(sec);
}

function dayOfYear(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

// Scatter state
let _sDaily  = null;
let _sHasEV  = true;

let _sState  = { view: 'all', ev: 'with', years: null };

// Scatter — full width standalone section
function renderScatter(daily, hasEV = true) {
  _sDaily = daily;
  _sHasEV = hasEV;
  _sFit   = 'off';
  _sState = { view: 'all', ev: 'with', years: null };

  row.className = 'scatter-trend-row';  // grid layout needed when both panels present
  row.id = 'scatter-trend-row';
  main.appendChild(row);
  _buildScatter();
  _buildTrend(row);
}

// ── CURVE FIT HELPERS ────────────────────────────────────────────────────────

function _loess(pts, bandwidth) {
  // pts: [{x, y}] sorted by x. Returns [{x, y}] smoothed values at same x positions.
  const n = pts.length;
  if (n < 3) return pts;
  const bw = Math.max(Math.ceil(bandwidth * n), 3);
  return pts.map((p, i) => {
    const lo = Math.max(0, i - bw), hi = Math.min(n - 1, i + bw);
    const neighbors = pts.slice(lo, hi + 1);
    const maxDist = Math.max(Math.abs(p.x - neighbors[0].x), Math.abs(p.x - neighbors[neighbors.length-1].x)) || 1;
    let sw = 0, swx = 0, swy = 0, swxx = 0, swxy = 0;
    neighbors.forEach(q => {
      const u = Math.abs(p.x - q.x) / maxDist;
      const w = Math.pow(1 - Math.pow(Math.min(u, 1), 3), 3);
      sw   += w;   swx  += w*q.x; swy  += w*q.y;
      swxx += w*q.x*q.x; swxy += w*q.x*q.y;
    });
    const det = sw*swxx - swx*swx;
    if (Math.abs(det) < 1e-10) return { x: p.x, y: swy/sw };
    const b1 = (sw*swxy - swx*swy) / det;
    const b0 = (swy - b1*swx) / sw;
    return { x: p.x, y: b0 + b1*p.x };
  });
}

function _polyFit(pts, degree) {
  // Least-squares polynomial fit. Returns [{x, y}] at same x positions.
  const n = pts.length;
  if (n < degree + 1) return pts;
  const d = degree + 1;
  // Build normal equations A^T A c = A^T y
  const A = pts.map(p => Array.from({length: d}, (_, k) => Math.pow(p.x, k)));
  const AtA = Array.from({length: d}, (_, i) => Array.from({length: d}, (_, j) =>
    A.reduce((s, row) => s + row[i]*row[j], 0)));
  const Aty = Array.from({length: d}, (_, i) => A.reduce((s, row, ri) => s + row[i]*pts[ri].y, 0));
  // Gaussian elimination
  const M = AtA.map((row, i) => [...row, Aty[i]]);
  for (let col = 0; col < d; col++) {
    let pivot = col;
    for (let r = col+1; r < d; r++) if (Math.abs(M[r][col]) > Math.abs(M[pivot][col])) pivot = r;
    [M[col], M[pivot]] = [M[pivot], M[col]];
    if (Math.abs(M[col][col]) < 1e-12) continue;
    for (let r = 0; r < d; r++) {
      if (r === col) continue;
      const f = M[r][col] / M[col][col];
      for (let c = col; c <= d; c++) M[r][c] -= f * M[col][c];
    }
  }
  const coef = M.map((row, i) => row[d] / row[i]);
  return pts.map(p => ({ x: p.x, y: coef.reduce((s, c, k) => s + c * Math.pow(p.x, k), 0) }));
}

function _fitDatasets(rows, year, alpha, useHouse) {
  // Build fit line datasets for one year. Returns array of Chart.js datasets.
  if (_sFit === 'off' || !rows.length) return [];
  const fitFn = _sFit === 'loess'
    ? pts => _loess(pts, 0.2)
    : pts => _polyFit(pts, 4);

  const result = [];
  const prodPts = rows.map(r => ({ x: dayOfYear(r.date), y: r.prod_kwh })).sort((a,b)=>a.x-b.x);
  const consPts = rows.map(r => ({ x: dayOfYear(r.date), y: useHouse ? r.house_kwh : r.cons_kwh })).sort((a,b)=>a.x-b.x);
  const fitAlpha = (parseFloat(alpha) * 0.7).toFixed(2);

  result.push({
    label: `Prod Fit ${year}`,
    data:  fitFn(prodPts),
    borderColor: `rgba(245,158,11,${fitAlpha})`,
    backgroundColor: 'transparent',
    borderWidth: 1.5,
    borderDash: [4, 3],
    pointRadius: 0,
    tension: 0.4,
    type: 'line',
  });
  result.push({
    label: `Cons Fit ${year}`,
    data:  fitFn(consPts),
    borderColor: `rgba(34,211,238,${fitAlpha})`,
    backgroundColor: 'transparent',
    borderWidth: 1.5,
    borderDash: [4, 3],
    pointRadius: 0,
    tension: 0.4,
    type: 'line',
  });
  return result;
}

function _buildScatter() {
  const daily    = _sDaily;
  const allYears = [...new Set(daily.map(r => r.date.slice(0,4)))].sort();
  const n        = allYears.length;
  const activeYears = _sState.years || allYears;

  const datasets = [];
  allYears.forEach((year, yi) => {
    if (!activeYears.includes(year)) return;
    const t     = n === 1 ? 1 : yi / (n - 1);
    const alpha = (0.25 + t * 0.60).toFixed(2);
    const rows  = daily.filter(r => r.date.startsWith(year));
    const useHouse = _sState.ev === 'without';

    if (_sState.view !== 'cons') {
      datasets.push({
        label: `Prod ${year}`,
        data: rows.map(r => ({ x: dayOfYear(r.date), y: r.prod_kwh })),
        backgroundColor: `rgba(245,158,11,${alpha})`,
        pointRadius: 3, pointHoverRadius: 5,
      });
    }
    if (_sState.view !== 'prod') {
      const evAlpha = (parseFloat(alpha) * 0.85).toFixed(2);
      const showEvDots = _sState.ev === 'with';
      datasets.push({
        label: `Cons ${year}`,
        data: rows.map(r => ({ x: dayOfYear(r.date), y: useHouse ? r.house_kwh : r.cons_kwh })),
        backgroundColor: rows.map(r =>
          (showEvDots && r.ev_kwh > 0)
            ? `rgba(167,139,250,${evAlpha})`
            : `rgba(34,211,238,${alpha})`
        ),
        pointRadius: 3, pointHoverRadius: 5,
      });
    }
    // Inject fit lines for this year (respects VIEW toggle)
    _fitDatasets(rows, year, alpha, useHouse).forEach(ds => {
      if (_sState.view === 'cons' && ds.label.startsWith('Prod Fit')) return;
      if (_sState.view === 'prod' && ds.label.startsWith('Cons Fit')) return;
      datasets.push(ds);
    });
  });

  // Data-only update if chart already exists
  if (window._charts.scatter) {
    window._charts.scatter.data.datasets = datasets;
    window._charts.scatter.update();
    _syncScatterToggles(allYears);
    return;
  }

  // Full DOM build
  const row = document.getElementById('scatter-trend-row');
  const wrap = document.createElement('div');
  wrap.id = 'scatter-section';

  const yearChips = allYears.map(yr =>
    `<button class="tog active-year" data-year="${yr}" id="ychip-${yr}">${yr}</button>`
  ).join('');

  wrap.innerHTML = `
    <div class="section-label">// DAILY OUTPUT BY CALENDAR DAY</div>
    <div class="panel">
      <div class="panel-header" style="flex-direction:column;align-items:flex-start;gap:10px;">
        <div style="display:flex;justify-content:space-between;width:100%;align-items:center;flex-wrap:wrap;gap:8px;">
          <div class="panel-title">Production vs Consumption — Jan → Dec</div>
          <div class="legend" id="scatter-legend">
            ${allYears.map((yr, yi) => {
              const t = n===1?1:yi/(n-1);
              const a = (0.25+t*0.60).toFixed(2);
              return `<span style="font-size:11px;color:${cssVar('--muted')}">${yr}</span>
                      <span class="legend-dot" style="background:rgba(245,158,11,${a})"></span>
                      <span class="legend-dot" style="background:rgba(34,211,238,${a})"></span>`;
            }).join('')}
            <span style="border-left:1px solid ${cssVar('--border')};padding-left:10px;display:flex;gap:10px;">
              <span class="legend-item"><span class="legend-dot" style="background:var(--prod)"></span>Prod</span>
              <span class="legend-item"><span class="legend-dot" style="background:var(--cons)"></span>Cons</span>
              ${_sHasEV ? `<span class="legend-item" id="ev-dot-legend" style="display:${_sState.ev === 'with' ? 'flex' : 'none'}"><span class="legend-dot" style="background:var(--ev)"></span>Cons + EV day</span>` : ''}
            </span>
          </div>
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;">
          <div class="toggle-group">
            <span class="toggle-group-label">VIEW</span>
            <button class="tog active" id="tog-all"  >ALL</button>
            <button class="tog"        id="tog-prod" >PROD ONLY</button>
            <button class="tog"        id="tog-cons" >CONS ONLY</button>
          </div>
          <div class="toggle-group">
            <span class="toggle-group-label">YEARS</span>
            <button class="tog active" id="tog-allyears">ALL YEARS</button>
            <button class="tog"        id="tog-selyears">SELECT</button>
          </div>
          ${_sHasEV ? `<div class="toggle-group">
            <span class="toggle-group-label">EV</span>
            <button class="tog active-ev" id="tog-withev"   >WITH EV</button>
            <button class="tog"           id="tog-withoutev">NO EV</button>
          </div>` : ''}
          <div class="toggle-group" style="display:none">
            <span class="toggle-group-label">FIT</span>
            <button class="tog active" id="tog-fit-off"  >OFF</button>
            <button class="tog"        id="tog-fit-loess">LOESS</button>
            <button class="tog"        id="tog-fit-poly" >POLY</button>
          </div>
        </div>
        <div class="year-chips" id="year-chips" style="display:none">${yearChips}</div>
      </div>
      <div class="chart-wrap" style="height:360px"><canvas id="scatter-canvas"></canvas></div>
    </div>`;
  row.appendChild(wrap);

  // View toggles
  wrap.querySelector('#tog-all').addEventListener('click',  () => { _sState.view = 'all';  _buildScatter(); });
  wrap.querySelector('#tog-prod').addEventListener('click', () => { _sState.view = 'prod'; _buildScatter(); });
  wrap.querySelector('#tog-cons').addEventListener('click', () => { _sState.view = 'cons'; _buildScatter(); });

  // Years toggles
  wrap.querySelector('#tog-allyears').addEventListener('click', () => {
    _sState.years = null;
    wrap.querySelector('#year-chips').style.display = 'none';
    _buildScatter();
  });
  wrap.querySelector('#tog-selyears').addEventListener('click', () => {
    if (_sState.years === null) _sState.years = [...allYears];
    wrap.querySelector('#year-chips').style.display = 'flex';
    _buildScatter();
  });
  allYears.forEach(yr => {
    wrap.querySelector(`#ychip-${yr}`).addEventListener('click', () => {
      if (_sState.years === null) return;
      const idx = _sState.years.indexOf(yr);
      if (idx >= 0 && _sState.years.length > 1) _sState.years.splice(idx, 1);
      else if (idx < 0) { _sState.years.push(yr); _sState.years.sort(); }
      _buildScatter();
    });
  });

  // EV toggles
  if (_sHasEV) {
    wrap.querySelector('#tog-withev').addEventListener('click', () => {
      _sState.ev = 'with';
      _buildScatter();
      const el = document.getElementById('ev-dot-legend');
      if (el) el.style.display = 'flex';
    });
    wrap.querySelector('#tog-withoutev').addEventListener('click', () => {
      _sState.ev = 'without';
      _buildScatter();
      const el = document.getElementById('ev-dot-legend');
      if (el) el.style.display = 'none';
    });
  }

  // FIT toggles
  [['#tog-fit-off','off'],['#tog-fit-loess','loess'],['#tog-fit-poly','poly']].forEach(([sel,val]) => {
    wrap.querySelector(sel).addEventListener('click', () => {
      _sFit = val;
      wrap.querySelectorAll('#tog-fit-off,#tog-fit-loess,#tog-fit-poly').forEach(b => b.classList.remove('active'));
      wrap.querySelector(sel).classList.add('active');
      _buildScatter();
    });
  });

  const { color, grid, gridSoft } = chartDefaults();
  window._charts.scatter = new Chart(
    wrap.querySelector('#scatter-canvas').getContext('2d'),
    {
      type: 'scatter',
      data: { datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            ...tooltipStyle(),
            callbacks: {
              label: ctx => {
                const isC = ctx.dataset.label.startsWith('Cons');
                if (isC && _sState.ev === 'without') return `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} kWh (house only)`;
                if (isC && _sState.ev === 'with') {
                  // Find the original row to check ev_kwh
                  const doy = ctx.parsed.x;
                  const year = ctx.dataset.label.replace('Cons ', '');
                  const row = _sDaily.find(r => r.date.startsWith(year) && dayOfYear(r.date) === doy);
                  const evSuffix = (row && row.ev_kwh > 0) ? ` ⚡ ${row.ev_kwh.toFixed(1)} kWh EV` : '';
                  return `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} kWh${evSuffix}`;
                }
                return `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} kWh`;
              },
            },
          },
        },
        scales: {
          x: {
            type: 'linear', min: 1, max: 366,
            afterBuildTicks: axis => { axis.ticks = MONTH_DOYS.map(v => ({ value: v })); },
            ticks: {
              color,
              font: { family: "'Share Tech Mono', monospace", size: 11 },
              callback: v => {
                const i = MONTH_DOYS.findIndex((t, idx) => v >= t && (idx === 11 || v < MONTH_DOYS[idx+1]));
                return i >= 0 ? MONTHS[i] : '';
              },
            },
            grid: { color: gridSoft }, border: { color: grid },
          },
          y: {
            ticks: { color, font: { family: "'Share Tech Mono', monospace", size: 11 }, callback: v => v + ' kWh' },
            grid: { color: gridSoft }, border: { color: grid },
          },
        },
      },
    }
  );
  _syncScatterToggles(allYears);
}

function _syncScatterToggles(allYears) {
  const sec = document.getElementById('scatter-section');
  if (!sec) return;
  ['all','prod','cons'].forEach(v => {
    const el = sec.querySelector(`#tog-${v}`);
    if (el) el.className = 'tog' + (_sState.view === v ? ' active' : '');
  });
  const isSelMode = _sState.years !== null;
  const ay = sec.querySelector('#tog-allyears');
  const sy = sec.querySelector('#tog-selyears');
  if (ay) ay.className = 'tog' + (!isSelMode ? ' active' : '');
  if (sy) sy.className = 'tog' + (isSelMode ? ' active-year' : '');
  const chips = sec.querySelector('#year-chips');
  if (chips) chips.style.display = isSelMode ? 'flex' : 'none';
  if (isSelMode) {
    allYears.forEach(yr => {
      const chip = sec.querySelector(`#ychip-${yr}`);
      if (chip) chip.className = 'tog' + (_sState.years.includes(yr) ? ' active-year' : '');
    });
  }
  const we  = sec.querySelector('#tog-withev');
  const noe = sec.querySelector('#tog-withoutev');
  if (we)  we.className  = 'tog' + (_sState.ev === 'with'    ? ' active-ev' : '');
  if (noe) noe.className = 'tog' + (_sState.ev === 'without' ? ' active-ev' : '');
}

// ── TREND CHART ───────────────────────────────────────────────────────────────
function _buildTrend(container) {
  const daily = _sDaily;
  const WINDOW = 30;

  const sorted = [...daily].sort((a,b) => a.date.localeCompare(b.date));

  // 30-day rolling average — x is numeric index (avoids date adapter dependency)
  const rollingAvg = sorted.map((r, i) => {
    const slice = sorted.slice(Math.max(0, i - WINDOW + 1), i + 1);
    const avg   = slice.reduce((s, d) => s + d.net_kwh, 0) / slice.length;
    return { x: i, y: parseFloat(avg.toFixed(2)) };
  });

  // Raw daily net as faint scatter
  const rawNet = sorted.map((r, i) => ({ x: i, y: parseFloat(r.net_kwh.toFixed(2)) }));

  // Use passed container, or standalone wrap, or scatter-trend-row
  const row = container || document.getElementById('trend-standalone-wrap') || document.getElementById('scatter-trend-row');
  const wrap = document.createElement('div');
  wrap.id = 'trend-section';
  wrap.innerHTML = `
    <div class="section-label">// NET SURPLUS TREND</div>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Net Energy — 30d Rolling Avg</div>
        <div class="legend">
          <span class="legend-item"><span class="legend-dot" style="background:var(--surplus)"></span>Surplus</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--deficit)"></span>Deficit</span>
        </div>
      </div>
      <div class="chart-wrap" style="height:300px"><canvas id="trend-canvas"></canvas></div>
    </div>`;
  row.appendChild(wrap);

  const { color, grid, gridSoft } = chartDefaults();

  // Split into surplus/deficit segments — null where the other applies
  const surplusLine = rollingAvg.map(p => ({ x: p.x, y: p.y >= 0 ? p.y : null }));
  const deficitLine = rollingAvg.map(p => ({ x: p.x, y: p.y <  0 ? p.y : null }));
  // Zero line uses first/last index
  const zeroStart = 0;
  const zeroEnd   = sorted.length - 1;

  if (window._charts.trend) window._charts.trend.destroy();
  window._charts.trend = new Chart(
    wrap.querySelector('#trend-canvas').getContext('2d'),
    {
      type: 'line',
      data: {
        datasets: [
          {
            // Zero reference line — rendered as a flat dataset, no plugin needed
            label: 'Zero',
            data: [
              { x: zeroStart, y: 0 },
              { x: zeroEnd,   y: 0 },
            ],
            borderColor: cssVar('--muted'),
            borderWidth: 1,
            borderDash: [4, 4],
            pointRadius: 0,
            fill: false,
          },
          {
            label: 'Raw daily net',
            data: rawNet,
            borderColor: 'transparent',
            backgroundColor: 'rgba(148,163,184,0.15)',
            pointRadius: 2,
            pointHoverRadius: 4,
            showLine: false,
            // No parsing:false — let Chart.js parse {x, y} natively
          },
          {
            label: 'Surplus (30d avg)',
            data: surplusLine,
            borderColor: '#34d399',
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.3,
            fill: { target: 'origin', above: 'rgba(52,211,153,0.12)' },
            spanGaps: false,
          },
          {
            label: 'Deficit (30d avg)',
            data: deficitLine,
            borderColor: '#f87171',
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.3,
            fill: { target: 'origin', below: 'rgba(248,113,113,0.12)' },
            spanGaps: false,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            ...tooltipStyle(),
            filter: item => !['Raw daily net','Zero'].includes(item.dataset.label),
            callbacks: {
              title: items => {
                const idx = items[0]?.parsed?.x;
                return (idx != null && sorted[Math.round(idx)]) ? sorted[Math.round(idx)].date : '';
              },
              label: ctx => {
                if (ctx.parsed?.y == null) return null;
                return `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} kWh`;
              },
            },
          },
          // zero line rendered as a dataset — no plugin required
        },
        scales: {
          x: {
            type: 'linear',
            ticks: {
              color,
              font: { family: "'Share Tech Mono', monospace", size: 9 },
              maxRotation: 0,
              callback: (val) => {
                // val is the index into sorted array — map back to MMM YY
                const r = sorted[Math.round(val)];
                if (!r) return '';
                const d = new Date(r.date + 'T00:00:00');
                // Show label only on the 1st of each month
                if (d.getDate() > 3) return '';
                return d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
              },
              autoSkip: false,
              maxTicksLimit: 24,
            },
            grid: { color: gridSoft }, border: { color: grid },
          },
          y: {
            ticks: { color, font: { family: "'Share Tech Mono', monospace", size: 11 }, callback: v => v + ' kWh' },
            grid: { color: gridSoft }, border: { color: grid },
          },
        },
      },
    }
  );
}

// ── MONTHLY PRODUCTION + YoY ─────────────────────────────────────────────────
// Error bar mode: 'sd' | 'sem'
let _errMode = 'sd';
// YoY view mode: 'annual' | 'monthly'
let _yoyMode = 'annual';
// BY MONTH sub-view: 'prod' | 'cons'
let _yoyMonthlyView = 'prod';
let _yoyMonthly = null;  // stored for toggle re-render
let _yoyDaily   = null;
let _yoyHasEV   = true;

function _stdDev(arr) {
  if (arr.length < 2) return 0;
  const mean = arr.reduce((a,b) => a+b, 0) / arr.length;
  return Math.sqrt(arr.reduce((s, v) => s + (v - mean) ** 2, 0) / (arr.length - 1));
}

function renderMonthlyAndYoY(monthly, daily, hasEV = true) {
  _yoyMonthly = monthly;
  _yoyDaily   = daily;
  _yoyHasEV   = hasEV;

  const main = document.getElementById('main');
  const sec  = document.createElement('div');
  sec.id = 'monthly-section';
  sec.innerHTML = '<div class="section-label">// MONTHLY & ANNUAL BREAKDOWN</div>';
  const two = document.createElement('div');
  two.className = 'two-col';

  // ── Per-month stats: production kWh per year ──────────────────────────────
  // Group: byMonth[i].yearVals = [kWh for each year that has data for month i]
  const byMonth = Array.from({length:12}, () => ({ yearVals: [] }));
  monthly.forEach(m => {
    const idx = parseInt(m.month.slice(5)) - 1;
    if (m.prod_kwh > 0) byMonth[idx].yearVals.push(m.prod_kwh);
  });

  const monthStats = byMonth.map(m => {
    const n = m.yearVals.length;
    if (n === 0) return { mean: 0, sd: 0, sem: 0, n: 0 };
    const mean = m.yearVals.reduce((a,b) => a+b, 0) / n;
    const sd   = _stdDev(m.yearVals);
    const sem  = sd / Math.sqrt(n);
    return { mean, sd, sem, n };
  });

  // ── Left panel: monthly production bars ──────────────────────────────────
  const leftPanel = document.createElement('div');
  leftPanel.className = 'panel';
  leftPanel.id = 'monthly-panel';
  leftPanel.innerHTML = `
    <div class="panel-header">
      <div style="display:flex;align-items:baseline;gap:8px;">
        <div class="panel-title">Avg Monthly Production</div>
        <div style="font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted)">MWh</div>
      </div>
      <div class="toggle-group">
        <span class="toggle-group-label">SD</span>
        <button class="tog active" id="err-sd"  >ON</button>
        <button class="tog"        id="err-none">OFF</button>
      </div>
    </div>
    <div class="monthly-grid" id="monthly-bars"></div>`;
  two.appendChild(leftPanel);

  leftPanel.querySelector('#err-sd').addEventListener('click', () => {
    _errMode = 'sd';
    _rebuildMonthlyBars(monthStats, leftPanel.querySelector('#monthly-bars'));
    leftPanel.querySelector('#err-sd').className   = 'tog active';
    leftPanel.querySelector('#err-none').className = 'tog';
  });

function _buildYoY(years, rightPanel) {
  const monthly = _yoyMonthly;
  const daily   = _yoyDaily;
  if (window._charts.yoy) { window._charts.yoy.destroy(); window._charts.yoy = null; }
  const { color, grid, gridSoft } = chartDefaults();

  if (_yoyMode === 'annual') {
    // ── Annual totals: one grouped+stacked bar per year ──────────────────────
    const yoyProd  = years.map(y => daily.filter(r=>r.date.startsWith(y)).reduce((s,r)=>s+r.prod_kwh, 0));
    const yoyHouse = years.map(y => daily.filter(r=>r.date.startsWith(y)).reduce((s,r)=>s+r.house_kwh, 0));
    const yoyEv    = _yoyHasEV ? years.map(y => daily.filter(r=>r.date.startsWith(y)).reduce((s,r)=>s+r.ev_kwh, 0)) : null;

    window._charts.yoy = new Chart(
      rightPanel.querySelector('#yoy-canvas').getContext('2d'),
      {
        type: 'bar',
        data: {
          labels: years,
          datasets: [
            { label: 'Production', data: yoyProd,  backgroundColor: 'rgba(245,158,11,0.75)', borderColor: '#f59e0b', borderWidth: 1, stack: 'prod' },
            { label: 'House',      data: yoyHouse, backgroundColor: 'rgba(34,211,238,0.45)', borderColor: '#22d3ee', borderWidth: 1, stack: 'cons' },
            ...(_yoyHasEV && yoyEv ? [{ label: 'EV', data: yoyEv, backgroundColor: 'rgba(167,139,250,0.65)', borderColor: '#a78bfa', borderWidth: 1, stack: 'cons' }] : []),
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              ...tooltipStyle(),
              callbacks: {
                label: ctx => `${ctx.dataset.label}: ${(ctx.parsed.y/1000).toFixed(2)} MWh`,
                footer: items => {
                  const c = items.filter(i => (_yoyHasEV ? ['House','EV'] : ['House']).includes(i.dataset.label));
                  if (c.length > 1) return `Total cons: ${(c.reduce((s,i)=>s+i.parsed.y,0)/1000).toFixed(2)} MWh`;
                  return '';
                },
              },
            },
          },
          scales: {
            x: { stacked: true, ticks: { color, font: { family: "'Share Tech Mono', monospace", size: 11 } }, grid: { color: gridSoft }, border: { color: grid } },
            y: { stacked: true, ticks: { color, font: { family: "'Share Tech Mono', monospace", size: 11 }, callback: v => (v/1000).toFixed(1)+' MWh' }, grid: { color: gridSoft }, border: { color: grid } },
          },
        },
      }
    );
  } else {
    // ── BY MONTH: 12 groups on x-axis, one bar per year ──────────────────────
    // Toggle between PRODUCTION view (one bar/year) and CONSUMPTION view (house+EV stacked/year)
    const showProd = _yoyMonthlyView === 'prod';
    const datasets = [];

    years.forEach((year, yi) => {
      const t     = years.length === 1 ? 1 : yi / (years.length - 1);
      const alpha = (0.5 + t * 0.45).toFixed(2);

      const getVal = (field) => MONTHS.map((_, mi) => {
        const key = `${year}-${String(mi+1).padStart(2,'0')}`;
        const row = monthly.find(m => m.month === key);
        return row ? (row[field] || 0) : 0;
      });

      if (showProd) {
        // Production only — one bar per year per month, no stacking
        datasets.push({
          label: `Prod ${year}`,
          data: getVal('prod_kwh'),
          backgroundColor: `rgba(245,158,11,${alpha})`,
          borderColor: '#f59e0b', borderWidth: 1,
          stack: `prod-${year}`,
        });
      } else {
        // Consumption — house + EV stacked per year
        datasets.push({
          label: `House ${year}`,
          data: getVal('house_kwh'),
          backgroundColor: `rgba(34,211,238,${(parseFloat(alpha)*0.7).toFixed(2)})`,
          borderColor: '#22d3ee', borderWidth: 1,
          stack: `cons-${year}`,
        });
        if (_yoyHasEV) datasets.push({
          label: `EV ${year}`,
          data: getVal('ev_kwh'),
          backgroundColor: `rgba(167,139,250,${(parseFloat(alpha)*0.85).toFixed(2)})`,
          borderColor: '#a78bfa', borderWidth: 1,
          stack: `cons-${year}`,
        });
      }
    });

    window._charts.yoy = new Chart(
      rightPanel.querySelector('#yoy-canvas').getContext('2d'),
      {
        type: 'bar',
        data: { labels: MONTHS, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              ...tooltipStyle(),
              mode: 'index',
              callbacks: {
                label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(0)} kWh`,
                footer: items => {
                  if (!showProd && items.length > 1) {
                    const total = items.reduce((s,i)=>s+i.parsed.y,0);
                    return `Total: ${total.toFixed(0)} kWh`;
                  }
                  return '';
                },
              },
            },
          },
          scales: {
            x: { stacked: true, ticks: { color, font: { family: "'Share Tech Mono', monospace", size: 11 } }, grid: { color: gridSoft }, border: { color: grid } },
            y: { stacked: true, ticks: { color, font: { family: "'Share Tech Mono', monospace", size: 11 }, callback: v => v+' kWh' }, grid: { color: gridSoft }, border: { color: grid } },
          },
        },
      }
    );
  }
}

function _rebuildMonthlyBars(monthStats, barsEl) {
  // barsEl passed directly to avoid getElementById timing issues
  if (!barsEl) barsEl = document.getElementById('monthly-bars');
  if (!barsEl) return;
  barsEl.innerHTML = '';

  // Scale: max = highest mean + upper error
  const maxVal = Math.max(...monthStats.map(s => s.mean + (_errMode === 'sd' ? s.sd : 0)), 1);

  MONTHS.forEach((mo, i) => {
    const { mean, sd, sem, n } = monthStats[i];
    const err    = _errMode === 'sd' ? sd : 0;
    const hasErr = n >= 2;

    const wMean  = Math.min(mean         / maxVal * 100, 100);
    const wHigh  = Math.min((mean + err) / maxVal * 100, 100);

    // Color: amber for production bars (not coverage-based colouring)
    const col = 'var(--prod)';

    // Upper error bar only: vertical bar at wHigh% + top cap
    const errHtml = hasErr ? `
      <div class="month-error-bar" style="left:${wHigh}%;top:1px;bottom:1px;"></div>
      <div class="month-error-cap" style="left:${wHigh}%;top:50%;margin-top:-1px;"></div>` : '';

    const n1Label = (!hasErr && n === 1)
      ? `<span style="font-size:9px;color:var(--muted);margin-left:4px;opacity:0.6;">n=1</span>`
      : '';
    const row = document.createElement('div');
    row.className = 'month-row';
    row.innerHTML = `
      <div class="month-name">${mo}</div>
      <div class="month-bar-track">
        <div class="month-bar-fill" style="width:${wMean}%;background:${col}"></div>
        ${errHtml}
      </div>
      <div class="month-pct">${(mean/1000).toFixed(2)}${n1Label}</div>`;
    barsEl.appendChild(row);
  });
}
