            '<span style="color:var(--muted)">' + (c.field === 'prod_kwh' ? 'PROD' : 'CONS') + '</span>' +
            '<span style="color:var(--text)">' + c.daily_val.toFixed(2) + ' → ' + c.interval_val.toFixed(2) + ' kWh</span>' +
            '<span>' + dir + reviewed + '</span>' +
            '<span style="color:var(--muted)">' + c.abs_diff.toFixed(2) + ' kWh / ' + c.pct_diff.toFixed(1) + '%</span></div>';
        }).join('');

        yearGroupsHtml +=
          '<details style="margin-bottom:8px;border:1px solid var(--border);border-radius:6px;overflow:hidden;">' +
          '<summary style="padding:10px 14px;cursor:pointer;font-size:13px;font-family:monospace;color:var(--text);background:var(--bg2);list-style:none;display:flex;justify-content:space-between;">' +
          '<span>' + yrLabel + '</span>' +
          '<span style="color:var(--muted);font-size:11px;">▼</span></summary>' +
          '<div style="padding:8px 14px;">' +
          '<div style="' + CHDR + '"><span>Date</span><span>Field</span><span>Daily → Interval</span><span>Direction</span><span>Difference</span></div>' +
          rows + '</div></details>';
      });

      conflictsEl.innerHTML =
        '<div style="font-size:14px;color:var(--muted);margin-bottom:12px;">' + unreviewed.length + ' unreviewed of ' + all.length + ' total</div>' +
        globalBias +
        yearGroupsHtml +
        (unreviewed.length > 0 ? '<div class="settings-actions"><button class="import-btn" id="mark-all-reviewed">✓ MARK ALL REVIEWED</button></div>' : '');
    }
  }

  // Wire mark-all-reviewed
  const markBtn = document.getElementById('mark-all-reviewed');
  if (markBtn) {
    markBtn.addEventListener('click', async () => {
      const ids = (Array.isArray(conflictsRes) ? conflictsRes : [])
        .filter(c => !c.reviewed).map(c => c.id);
      if (!ids.length) return;
      await fetch('/api/conflicts/review', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ids}),
      });
      renderSettings();
    });
  }

  // Wire section selector — drag-to-reorder + checkbox visibility
  const saveBtn  = document.getElementById('save-sections');
  const resetBtn = document.getElementById('reset-sections');
  const dragList = document.getElementById('section-drag-list');

  // Drag-and-drop reorder
  if (dragList) {
    let _dragSrc = null;
    dragList.querySelectorAll('[data-drag-key]').forEach(row => {
      row.addEventListener('dragstart', e => {
        _dragSrc = row;
        setTimeout(() => row.style.opacity = '0.4', 0);
        e.dataTransfer.effectAllowed = 'move';
      });
      row.addEventListener('dragend', () => { row.style.opacity = '1'; });
      row.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const rect = row.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        dragList.querySelectorAll('[data-drag-key]').forEach(r => r.style.borderTop = r.style.borderBottom = '');
        if (after) row.style.borderBottom = '2px solid var(--prod)';
        else        row.style.borderTop    = '2px solid var(--prod)';
      });
      row.addEventListener('dragleave', () => {
        row.style.borderTop = row.style.borderBottom = '';
      });
      row.addEventListener('drop', e => {
        e.preventDefault();
        row.style.borderTop = row.style.borderBottom = '';
        if (!_dragSrc || _dragSrc === row) return;
        const rect = row.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        if (after) row.after(_dragSrc);
        else       row.before(_dragSrc);
      });
    });
  }

  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      const visMap = {};
      document.querySelectorAll('[data-section]').forEach(cb => {
        visMap[cb.dataset.section] = cb.checked;
      });
      const order = [...document.querySelectorAll('[data-drag-key]')].map(r => r.dataset.dragKey);
      _savePrefs(visMap, order);
      loadDashboard();
    });
  }
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      localStorage.removeItem(PREFS_KEY);
      renderSettings();
    });
  }

  // Wire restore button
  document.getElementById('settings-open-restore').addEventListener('click', () => {
    restoreOverlay.classList.add('open');
  });

  // Wire re-run setup wizard button
  document.getElementById('settings-rerun-wizard').addEventListener('click', async () => {
    // Clear setup_complete so wizard shows fresh, but preserve existing values as defaults
    await fetch('/api/setup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({setup_complete: null}),
    }).catch(() => {});
    // Pre-populate _wizData from current saved settings so fields aren't blank
    const current = await fetch('/api/setup').then(r => r.json()).catch(() => ({}));
    _wizData = {...(current.settings || {})};
    delete _wizData.setup_complete;
    _renderWizard('welcome');
  });

  // Wire theme buttons in settings
  sc.querySelectorAll('.theme-btn-settings').forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      localStorage.setItem(THEME_KEY, mode);
      applyTheme(mode);
    });
  });

  // Wire diagnostics run
  document.getElementById('run-diagnostics').addEventListener('click', async () => {
    const btn = document.getElementById('run-diagnostics');
    const out = document.getElementById('diag-result');
    btn.disabled = true;
    btn.textContent = 'RUNNING…';
    try {
      const r = await fetch('/api/diagnostics/run').then(res => res.json());
      out.innerHTML = [
        `DB write:     ${r.db_write_ok     ? '✓ OK' : '✗ ' + (r.db_write_error||'FAIL')}`,
        `Backup write: ${r.backup_write_ok ? '✓ OK' : '✗ ' + (r.backup_write_error||'FAIL')}`,
        `Timestamp:    ${fmtDate(r.timestamp)}`,
      ].join('<br>');
      out.classList.add('visible');
    } catch(e) {
      out.innerHTML = '✗ Request failed';
      out.classList.add('visible');
    }
    btn.disabled = false;
    btn.textContent = '▶ RUN ACTIVE CHECK';
  });
}

async function _loadSolarFingerprint(sec, daily) {
  sec.querySelectorAll('[data-sfyear]').forEach(b => {
    if (b.dataset.sfyear === 'ALL') b.classList.toggle('active', _sfShowAll);
    else b.classList.toggle('active', !_sfShowAll && b.dataset.sfyear === _sfYear);
  });


  sec.querySelector('#sf-seas-on')?.classList.toggle('active',  _sfShowSeasons);
  sec.querySelector('#sf-seas-off')?.classList.toggle('active', !_sfShowSeasons);

  const sfUrl = _sfShowAll ? '/api/solar-fingerprint' : '/api/solar-fingerprint?year=' + _sfYear;
  const curves = await fetch(sfUrl).then(r=>r.json()).catch(()=>[]);
  if (_sfChart) { _sfChart.destroy(); _sfChart = null; }

  const { color } = chartDefaults();
  const tt = tooltipStyle();
  const gridCol = 'rgba(128,128,128,0.12)';  // light grid for fingerprint

  // curves already filtered by API (all years or single year)
  const visibleCurves = curves;

  // Seasonal averages
  const seasonSlots = {};
  Object.keys(SF_SEASONS).forEach(s => { seasonSlots[s] = {}; });
  visibleCurves.forEach(day => {
    const month = parseInt(day.date.slice(5,7));
    const season = Object.entries(SF_SEASONS).find(([,s]) => s.months.includes(month))?.[0];
    if (!season) return;
    const shift = (_sfDSTOff && _isDST(day.date)) ? -1 : 0;
    day.points.forEach(p => {
      const key = String(p.x + shift);
      if (!seasonSlots[season][key]) seasonSlots[season][key] = [];
      seasonSlots[season][key].push(p.w);
    });
  });
  const seasonAvgs = {};
  Object.entries(seasonSlots).forEach(([season, slots]) => {
    seasonAvgs[season] = Object.entries(slots)
      .map(([x, vals]) => ({x: parseFloat(x), y: vals.reduce((a,b)=>a+b,0)/vals.length}))
      .sort((a,b) => a.x - b.x);
  });

  // DST helper — true if date falls in US Eastern DST (2nd Sun Mar → 1st Sun Nov)
  // Note: the DST offset toggle uses US Eastern rules. If your system is in a
  // different timezone, disable this toggle or the hour alignment will be incorrect.
  function _isDST(dateStr) {
    const d   = new Date(dateStr + 'T12:00:00');
    const yr  = d.getFullYear();
    const mar = new Date(yr, 2, 1);
    const nov = new Date(yr, 10, 1);
    const dstStart = new Date(yr, 2, 8  + (7 - mar.getDay()) % 7);
    const dstEnd   = new Date(yr, 10, 1 + (7 - nov.getDay()) % 7);
    return d >= dstStart && d < dstEnd;
  }

  // Datasets
  const datasets = [];
  const isLight     = document.documentElement.getAttribute('data-theme') === 'light';
  const baseOpacity  = isLight ? 0.18 : 0.10;
  const dayOpacity   = Math.max(0.05, Math.min(isLight ? 0.25 : 0.16, baseOpacity / Math.sqrt(visibleCurves.length / 100)));
  visibleCurves.forEach(day => {
    const shift = (_sfDSTOff && _isDST(day.date)) ? -1 : 0;
    let pts = day.points.map(p => ({x: p.x + shift, y: p.w}));
    const alpha = dayOpacity.toFixed(3);
    datasets.push({ label: day.date, data: pts, borderColor: 'rgba(245,158,11,' + alpha + ')',
      backgroundColor: 'transparent', borderWidth: 0.7, pointRadius: 0, tension: 0.3, parsing: false });
  });
  if (_sfShowSeasons) {
    Object.entries(SF_SEASONS).forEach(([season, cfg]) => {
      let pts = seasonAvgs[season] || [];
      if (!pts.length) return;
      datasets.push({ label: season, data: pts, borderColor: cfg.color,
        backgroundColor: 'transparent', borderWidth: 1.2, pointRadius: 0, tension: 0.4, parsing: false });
    });
  }

  const ctx = sec.querySelector('#solar-canvas')?.getContext('2d');
  if (!ctx) return;

  const yLabel    = 'Watts';
  const mono      = "'Share Tech Mono',monospace";
  const yCallback = v => v >= 1000 ? (v/1000).toFixed(1)+'k' : String(v);

  // Custom plugin: vertical legend in top-right of plot area
  const sfLegendPlugin = {
    id: 'sfLegend',
    afterDraw(chart) {
      const { ctx, chartArea: { right, top } } = chart;
      const entries = [
        ...Object.entries(SF_SEASONS).map(([label, s]) => ({ color: s.color, text: label + '  ' + s.dates })),
        { color: 'rgba(245,158,11,0.35)', text: 'each day' },
      ];
      const lineH = 16, padR = 12, padT = 10;
      const font = "11px 'Share Tech Mono',monospace";
      ctx.save();
      ctx.font = font;
      const maxW = Math.max(...entries.map(e => ctx.measureText('— ' + e.text).width));
      entries.forEach((e, i) => {
        const x = right - maxW - padR;
        const y = top + padT + i * lineH;
        ctx.fillStyle = e.color;
        ctx.fillText('— ' + e.text, x, y);
      });
      ctx.restore();
    }
  };

  _sfChart = new Chart(ctx, {
    type: 'line', plugins: [sfLegendPlugin], data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {
        legend: { display: false },
        tooltip: { ...tt,
          filter: item => Object.keys(SF_SEASONS).includes(item.dataset.label),
          callbacks: {
            title: items => items[0]?.dataset.label || '',
            label: item => item.parsed.y.toFixed(0) + ' W',
          }
        },
      },
      scales: {
        x: { type: 'linear', min: 3, max: 21,
          ticks: { color, font: { family: mono, size: 11 },
            callback: v => v % 3 === 0 ? String(v).padStart(2,'0') + ':00' : '', stepSize: 3 },
          grid: { color: gridCol, tickLength: 0 }, border: { color: gridCol } },
        y: { min: 0,
          ticks: { color, font: { family: mono, size: 11 }, callback: yCallback },
          grid: { color: gridCol }, border: { color: gridCol },
          title: { display: true, text: yLabel, color, font: { family: mono, size: 11 } } },
      },
    },
  });
}

async function _refreshDOW(sec) {
  let q = '';
  if (_dowEV === 'noev') q += '?exclude_ev=true';

  const dow = await fetch('/api/dow-profile' + q).then(r=>r.json()).catch(()=>[]);
  if (!dow.length) return;

  if (_dowChart) { _dowChart.destroy(); _dowChart = null; }

  const { color, gridSoft } = chartDefaults();
  const tt = tooltipStyle();
  const EK = _dowErrMode;   // 'sd' or 'none'

  const dotData = [], meanData = [];
  dow.forEach((d,i) => {
    meanData.push({x:i, y:d.avg_cons});
    (d.days||[]).forEach(val => { dotData.push({x: i + (Math.random()-0.5)*0.5, y:val}); });
  });
  const maxYdow = Math.max(
    ...meanData.map((m,i) => m.y + (EK === 'sd' ? (dow[i]?.sd_cons||0) : 0)),
    ...dotData.map(d => d.y)
  ) * 1.08;

  const datasets = [
    { label:'Days', data:dotData, type:'scatter',
      backgroundColor:'rgba(34,211,238,0.3)', borderColor:'rgba(34,211,238,0.5)',
      pointRadius:3, pointHoverRadius:5 },
    { label:'Mean', data:meanData, type:'scatter',
      backgroundColor:'#f59e0b', borderColor:'#f59e0b',
      pointStyle:'line', pointRadius:12, pointBorderWidth:3, pointHoverRadius:12,
      _errs: dow.map(d => EK === 'sd' ? (d.sd_cons||0) : 0), _errColor:'#f59e0b' },
  ];

  const ctx = sec.querySelector('#dow-canvas')?.getContext('2d');
  if (!ctx) return;

  _dowChart = new Chart(ctx, {
    type:'scatter', plugins:[_errPlugin],
    data:{ datasets },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{...tt, callbacks:{
        label: c => c.dataset.label==='Mean'
          ? 'Mean: ' + c.parsed.y.toFixed(2) + ' kWh'
          : DOW_LBL[Math.round(c.parsed.x)] + ': ' + c.parsed.y.toFixed(2) + ' kWh',
      }}},
      scales:{
        x:{ type:'linear', min:-0.5, max:6.5,
            ticks:{color, font:{family:"'Share Tech Mono',monospace",size:11},
                   callback:v=>DOW_LBL[Math.round(v)]||'', stepSize:1},
            grid:{color:gridSoft}, border:{color:gridSoft} },
        y:{ max:maxYdow,
            ticks:{color, font:{family:"'Share Tech Mono',monospace",size:11},
                   callback:v=>v.toFixed(1)+' kWh'},
            grid:{color:gridSoft}, border:{color:gridSoft} },
      }
    }
  });
}

// ── SELF-SUFFICIENCY HEATMAP (D-02) ─────────────────────────────────────────

async function renderHeatmap() {
  const main = document.getElementById('main');
  const drQSum = _drFrom ? `?from_date=${_drFrom}` : '';

  // Fetch heatmap data
  const rows = await fetch(`/api/heatmap${drQSum}`).then(r=>r.json()).catch(()=>[]);
  if (!rows.length) return;

  // Build date→value lookup
  const byDate = {};
  rows.forEach(r => { byDate[r.date] = r; });

  // Determine week grid: Sunday-aligned, 53 weeks max
  const firstDate = new Date(rows[0].date + 'T00:00:00');
  const lastDate  = new Date(rows[rows.length-1].date + 'T00:00:00');

  // Start from the Sunday on or before first date
  const gridStart = new Date(firstDate);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());

  // Color scale: deep red (large deficit) → neutral → deep green (large surplus)
  // Range: -20 to +20 kWh, clamped
  function netColor(net) {
    if (net === null || net === undefined) return 'var(--bg3)';
    const v = Math.max(-20, Math.min(20, net));
    if (v >= 0) {
      // surplus: 0→20 maps to neutral→green
      const t = v / 20;
      const r = Math.round(20 + (22-20)*(1-t));
      const g = Math.round(30 + (163-30)*t);
      const b = Math.round(30 + (74-30)*(1-t*0.7));
      return `rgb(${Math.round(20*(1-t)+22*t)},${Math.round(30+133*t)},${Math.round(30+44*(1-t*0.5))})`;
    } else {
      // deficit: 0→-20 maps to neutral→red
      const t = -v / 20;
      return `rgb(${Math.round(20+219*t)},${Math.round(30+38*(1-t))},${Math.round(30+38*(1-t))})`;
    }
  }

  // Build weeks array
  const weeks = [];
  let cur = new Date(gridStart);
  while (cur <= lastDate || weeks.length < 1) {
    const week = [];
    for (let d = 0; d < 7; d++) {
      const iso = cur.toISOString().slice(0,10);
      week.push({ date: iso, data: byDate[iso] || null });
      cur.setDate(cur.getDate()+1);
    }
    weeks.push(week);
    if (cur > lastDate && weeks.length > 1) break;
  }

  // SVG dimensions
  const CW = 13, CH = 13, GAP = 2;
  const LEFT_PAD = 28, TOP_PAD = 24, BOTTOM_PAD = 36;
  const W = weeks.length * (CW+GAP) + LEFT_PAD + 20;
  const H = 7*(CH+GAP) + TOP_PAD + BOTTOM_PAD;

  // Month labels
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DOW_SHORT = ['S','M','T','W','T','F','S'];

  let monthLabels = '';
  let lastMonth = -1;
  weeks.forEach((week, wi) => {
    const firstDay = week.find(d => d.data || d.date >= rows[0].date);
    if (!firstDay) return;
    const m = parseInt(firstDay.date.slice(5,7)) - 1;
    if (m !== lastMonth) {
      const x = LEFT_PAD + wi*(CW+GAP);
      monthLabels += `<text x="${x}" y="${TOP_PAD-6}" fill="var(--muted)" font-size="10" font-family="'Share Tech Mono',monospace">${MONTHS[m]}</text>`;
      lastMonth = m;
    }
  });

  // Day-of-week labels
  let dowLabels = '';
  [1,3,5].forEach(d => {
    const y = TOP_PAD + d*(CH+GAP) + CH - 2;
    dowLabels += `<text x="${LEFT_PAD-4}" y="${y}" fill="var(--muted)" font-size="10" font-family="'Share Tech Mono',monospace" text-anchor="end">${DOW_SHORT[d]}</text>`;
  });

  // Cells
  let cells = '';
  const tipData = {};
  weeks.forEach((week, wi) => {
    week.forEach((day, di) => {
      const x = LEFT_PAD + wi*(CW+GAP);
      const y = TOP_PAD + di*(CH+GAP);
      const col = day.data ? netColor(day.data.net_kwh) : 'var(--bg3)';
      const opacity = day.date < rows[0].date || day.date > rows[rows.length-1].date ? '0' : '1';
      const id = `hc-${day.date.replace(/-/g,'')}`;
      tipData[id] = day.data;
      cells += `<rect id="${id}" x="${x}" y="${y}" width="${CW}" height="${CH}" rx="2" fill="${col}" opacity="${opacity}" style="cursor:${day.data?'pointer':'default'}" data-date="${day.date}"/>`;
    });
  });

  // Legend
  const LX = LEFT_PAD, LY = H - BOTTOM_PAD + 14;
  let legend = `<text x="${LX}" y="${LY-2}" fill="var(--muted)" font-size="10" font-family="'Share Tech Mono',monospace">deficit</text>`;
  const steps = 20;
  for (let i = 0; i <= steps; i++) {
    const net = -20 + i*2;
    legend += `<rect x="${LX+52+i*10}" y="${LY-10}" width="10" height="10" rx="1" fill="${netColor(net)}"/>`;
  }
  legend += `<text x="${LX+52+(steps+1)*10+2}" y="${LY-2}" fill="var(--muted)" font-size="10" font-family="'Share Tech Mono',monospace">surplus</text>`;
  legend += `<text x="${LX+52+10*(steps/2)+5}" y="${LY+10}" fill="var(--muted)" font-size="9" font-family="'Share Tech Mono',monospace" text-anchor="middle">0 kWh net</text>`;

  const svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${W}px;display:block;">
    ${dowLabels}
    ${monthLabels}
    ${cells}
    ${legend}
  </svg>`;

  // Tooltip
  const tipEl = document.createElement('div');
  tipEl.id = 'heatmap-tip';
  tipEl.style.cssText = 'position:fixed;display:none;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:12px;font-family:"Share Tech Mono",monospace;color:var(--text);pointer-events:none;z-index:500;line-height:1.8;';
  document.body.appendChild(tipEl);

  // Build section
  const sec = document.createElement('div');
  sec.innerHTML = `
    <div class="section-label">// SELF-SUFFICIENCY HEATMAP</div>
    <div class="panel" style="overflow-x:auto;">
      <div class="panel-header">
        <div class="panel-title">Daily Net Energy — Production minus Consumption (kWh)</div>
      </div>
      <div style="padding:4px 0 8px;">${svg}</div>
    </div>`;
  main.appendChild(sec);

  // Wire tooltip
  sec.querySelectorAll('rect[data-date]').forEach(rect => {
    rect.addEventListener('mousemove', e => {
      const d = tipData[rect.id];
      if (!d) return;
      const net   = d.net_kwh >= 0 ? `+${d.net_kwh.toFixed(2)}` : d.net_kwh.toFixed(2);
      const suff  = d.self_suff_pct != null ? `${d.self_suff_pct.toFixed(1)}%` : '—';
      tipEl.innerHTML = `${d.date}<br>Net: <b style="color:${d.net_kwh>=0?'var(--surplus)':'var(--deficit)}'}">${net} kWh</b><br>Prod: ${d.prod_kwh.toFixed(2)} kWh<br>Cons: ${d.cons_kwh.toFixed(2)} kWh<br>Self-suff: ${suff}`;
      tipEl.style.display = 'block';
      tipEl.style.left = (e.clientX+14)+'px';
      tipEl.style.top  = (e.clientY-10)+'px';
    });
    rect.addEventListener('mouseleave', () => { tipEl.style.display = 'none'; });
  });
}

// ── INTERVAL DASHBOARDS ──────────────────────────────────────────────────────

let _iSeason   = 'All';
let _iErrMode  = 'sd';
let _iPeakEV   = 'all';   // 'all' | 'noev'
let _iDowEV    = 'all';   // 'all' | 'noev'
let _iCharts   = { hourly: null, grid: null };
let _dowChart  = null;
let _iDOMBuilt = false;

const SEASONS = ['All','Winter','Spring','Summer','Fall'];
const HOURS   = Array.from({length:24}, (_,i) => `${String(i).padStart(2,'0')}:00`);
const DOW_LBL = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// ── Error bar plugin (shared) ─────────────────────────────────────────────────
const _errPlugin = {
  id: 'errBars',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    chart.data.datasets.forEach((ds, di) => {
      if (!ds._errs) return;
      const meta = chart.getDatasetMeta(di);
      meta.data.forEach((bar, i) => {
        const err = ds._errs[i] || 0;
        if (!err) return;
        const x      = bar.x !== undefined ? bar.x : bar.getCenterPoint().x;
        const yScale = chart.scales.y;
        const yVal   = Array.isArray(ds.data[i]) ? ds.data[i][1] : (typeof ds.data[i] === 'object' ? ds.data[i].y : ds.data[i]);
        if (yVal == null) return;
        const yPx  = yScale.getPixelForValue(yVal + err);
        const yBase = yScale.getPixelForValue(yVal);
        ctx.save();
        ctx.strokeStyle = ds._errColor || ds.borderColor || '#fff';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x, yBase); ctx.lineTo(x, yPx); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x-5, yPx); ctx.lineTo(x+5, yPx); ctx.stroke();
        ctx.restore();
      });
    });
  }
};

// ── Build DOM once ────────────────────────────────────────────────────────────
function _buildIntervalDOM(hasEV = true) {
  if (_iDOMBuilt) return;
  const main = document.getElementById('main');
  let sec = document.getElementById('interval-section');
  if (!sec) { sec = document.createElement('div'); sec.id = 'interval-section'; main.appendChild(sec); }

  sec.innerHTML = `
    <div class="section-label">// 15-MIN INTERVAL ANALYTICS</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:16px;" id="interval-controls">
      <div class="toggle-group">
        <span class="toggle-group-label">SEASON</span>
        ${SEASONS.map(s=>`<button class="tog" data-season="${s}">${s.toUpperCase()}</button>`).join('')}
      </div>
      <div class="toggle-group">
        <span class="toggle-group-label">ERROR</span>
        <button class="tog" id="itog-sd">SD</button>
        <button class="tog" id="itog-sem">SEM</button>
      </div>
    </div>

    <div class="two-col" style="margin-bottom:16px;">
      <div class="panel" style="flex:2" id="ipanel-hourly">
        <div class="panel-header">
          <div class="panel-title">Hour-of-Day Profile — Avg Production vs Consumption</div>
          <div class="legend">
            <span class="legend-item"><span class="legend-dot" style="background:var(--prod)"></span>Production</span>
            <span class="legend-item"><span class="legend-dot" style="background:var(--cons)"></span>Consumption</span>
          </div>
        </div>
        <div class="chart-wrap" style="height:280px"><canvas id="hourly-canvas"></canvas></div>
      </div>

    </div>

    <div class="two-col" style="margin-bottom:16px;">
      <div class="panel" style="flex:2" id="ipanel-grid">
        <div class="panel-header">
          <div class="panel-title">Grid Dependency by Hour</div>
          <div class="legend">
            <span class="legend-item"><span class="legend-dot" style="background:var(--deficit)"></span>Grid Import</span>
            <span class="legend-item"><span class="legend-dot" style="background:var(--surplus)"></span>Grid Export</span>
          </div>
        </div>
        <div class="chart-wrap" style="height:280px"><canvas id="grid-canvas"></canvas></div>
      </div>
      <div class="panel" id="ipanel-peak">
        <div class="panel-header" style="flex-direction:column;align-items:flex-start;gap:8px;">
          <div class="panel-title">Peak Demand Events (Top 10)</div>
          ${hasEV ? `<div class="toggle-group">
            <span class="toggle-group-label">EV</span>
            <button class="tog" id="itog-all-ev">ALL</button>
            <button class="tog" id="itog-no-ev">EXCL EV</button>
          </div>` : ''}
        </div>
        <div id="peak-table-body"></div>
      </div>
    </div>`;

  // Wire toggles — update state and refresh only, no DOM rebuild
  sec.querySelectorAll('[data-season]').forEach(btn => {
    btn.addEventListener('click', () => { _iSeason = btn.dataset.season; _syncIntervalToggles(); _refreshIntervalCharts(); });
  });
  sec.querySelector('#itog-sd').addEventListener('click',    () => { _iErrMode='sd';   _syncIntervalToggles(); _refreshIntervalCharts(); });
  sec.querySelector('#itog-sem').addEventListener('click',   () => { _iErrMode='sem';  _syncIntervalToggles(); _refreshIntervalCharts(); });
  if (hasEV) {
    sec.querySelector('#itog-all-ev')?.addEventListener('click',    () => { _iPeakEV='all';   _syncIntervalToggles(); _refreshIntervalCharts(); });
    sec.querySelector('#itog-no-ev')?.addEventListener('click',     () => { _iPeakEV='noev';  _syncIntervalToggles(); _refreshIntervalCharts(); });

  }

  _iDOMBuilt = true;
}

function _syncIntervalToggles() {
  const sec = document.getElementById('interval-section');
  if (!sec) return;
  sec.querySelectorAll('[data-season]').forEach(b => b.classList.toggle('active', b.dataset.season === _iSeason));
  const sdBtn  = sec.querySelector('#itog-sd');
  const semBtn = sec.querySelector('#itog-sem');
  if (sdBtn)  sdBtn.classList.toggle('active',  _iErrMode === 'sd');
  if (semBtn) semBtn.classList.toggle('active', _iErrMode === 'sem');
  sec.querySelector('#itog-all-ev')?.classList.toggle('active', _iPeakEV === 'all');
  sec.querySelector('#itog-no-ev')?.classList.toggle('active',  _iPeakEV === 'noev');

}

// ── Refresh charts (no DOM rebuild) ──────────────────────────────────────────
async function _refreshIntervalCharts() {
  const q      = _iSeason !== 'All' ? `?season=${_iSeason}` : '';
  const peakQ  = `/api/peak-demand?limit=10${_iPeakEV==='noev'?'&exclude_ev=true':''}`;

  const [hourly, dow, grid, peaks] = await Promise.all([
    fetch(`/api/hourly-profile${q}`).then(r=>r.json()).catch(()=>[]),
    Promise.resolve([]),  // DOW now standalone
    fetch(`/api/grid-dependency${q}`).then(r=>r.json()).catch(()=>[]),
    fetch(peakQ).then(r=>r.json()).catch(()=>[]),
  ]);

  const { color, gridSoft: gridCol } = chartDefaults();
  const tt = tooltipStyle();
  const EK = _iErrMode;

  // ── Chart 1: Hourly profile ──────────────────────────────────────────────
  if (hourly.length) {
    const errP = hourly.map(h => h[EK==='sd'?'sd_prod':'sem_prod'] || 0);
    const errC = hourly.map(h => h[EK==='sd'?'sd_cons':'sem_cons'] || 0);
    const maxY = Math.max(...hourly.map((h,i)=> Math.max(h.avg_prod+(errP[i]||0), h.avg_cons+(errC[i]||0)))) * 1.08;
    const datasets = [
      { label:'Production', data:hourly.map(h=>h.avg_prod), backgroundColor:'rgba(245,158,11,0.6)', borderColor:'#f59e0b', borderWidth:1, _errs:errP, _errColor:'#f59e0b' },
      { label:'Consumption', data:hourly.map(h=>h.avg_cons), backgroundColor:'rgba(34,211,238,0.5)', borderColor:'#22d3ee', borderWidth:1, _errs:errC, _errColor:'#22d3ee' },
    ];
    if (_iCharts.hourly) {
      _iCharts.hourly.data.datasets = datasets;
      _iCharts.hourly.options.scales.y.max = maxY;
      _iCharts.hourly.update();
    } else {
      const ctx = document.getElementById('hourly-canvas')?.getContext('2d');
      if (ctx) _iCharts.hourly = new Chart(ctx, {
        type:'bar', plugins:[_errPlugin],
        data:{ labels:HOURS, datasets },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{display:false}, tooltip:{...tt, callbacks:{
            label: c => `${c.dataset.label}: ${c.parsed.y.toFixed(3)} kWh`,
            afterLabel: c => { const e=c.dataset._errs?.[c.dataIndex]; return e?`±${e.toFixed(3)} (${EK.toUpperCase()})`:''; }
          }}},
          scales:{
            x:{ ticks:{color, font:{family:"'Share Tech Mono',monospace",size:11}}, grid:{color:gridCol}, border:{color:gridCol} },
            y:{ max:maxY, ticks:{color, font:{family:"'Share Tech Mono',monospace",size:11}, callback:v=>v.toFixed(2)}, grid:{color:gridCol}, border:{color:gridCol} },
          }
        }
      });
    }
  }

  // ── Chart 3: Grid dependency ──────────────────────────────────────────────
  if (grid.length) {
    const errI = grid.map(g => g[EK==='sd'?'sd_imp':'sem_imp'] || 0);
    const errE = grid.map(g => g[EK==='sd'?'sd_exp':'sem_exp'] || 0);
    const maxYg = Math.max(...grid.map((g,i)=> Math.max(g.avg_imp+(errI[i]||0), g.avg_exp+(errE[i]||0)))) * 1.08;
    const gDatasets = [
      { label:'Grid Import', data:grid.map(g=>g.avg_imp), backgroundColor:'rgba(239,68,68,0.55)', borderColor:'#ef4444', borderWidth:1, _errs:errI, _errColor:'#ef4444' },
      { label:'Grid Export', data:grid.map(g=>g.avg_exp), backgroundColor:'rgba(74,222,128,0.55)', borderColor:'#4ade80', borderWidth:1, _errs:errE, _errColor:'#4ade80' },
    ];
    if (_iCharts.grid) {
      _iCharts.grid.data.datasets = gDatasets;
      _iCharts.grid.options.scales.y.max = maxYg;
      _iCharts.grid.update();
    } else {
      const ctx = document.getElementById('grid-canvas')?.getContext('2d');
      if (ctx) _iCharts.grid = new Chart(ctx, {
        type:'bar', plugins:[_errPlugin],
        data:{ labels:HOURS, datasets:gDatasets },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{display:false}, tooltip:{...tt, callbacks:{
            label: c => `${c.dataset.label}: ${c.parsed.y.toFixed(3)} kWh`,
          }}},
          scales:{
            x:{ ticks:{color, font:{family:"'Share Tech Mono',monospace",size:11}}, grid:{color:gridCol}, border:{color:gridCol} },
            y:{ max:maxYg, ticks:{color, font:{family:"'Share Tech Mono',monospace",size:11}, callback:v=>v.toFixed(2)}, grid:{color:gridCol}, border:{color:gridCol} },
          }
        }
      });
    }
  }

  // ── Peak demand table ─────────────────────────────────────────────────────
  const peakBody = document.getElementById('peak-table-body');
  if (peakBody) {
    const hdr = `<div style="display:grid;grid-template-columns:24px 90px 55px 1fr 1fr;gap:0 10px;padding:0 4px 8px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;">
      <span>#</span><span>Date</span><span>Time</span><span>kWh</span><span>Source</span></div>`;
    const rows = peaks.map((p,i) => `
      <div style="display:grid;grid-template-columns:24px 90px 55px 1fr 1fr;gap:0 10px;padding:6px 4px;border-bottom:1px solid var(--border);font-size:12px;font-family:monospace;${i===peaks.length-1?'border-bottom:none;':''}">
        <span style="color:var(--muted)">${i+1}</span>
        <span style="color:var(--text)">${p.date}</span>
        <span style="color:var(--prod)">${p.time_label}</span>
        <span style="color:var(--deficit)">${(p.cons_wh/1000).toFixed(3)}</span>
        <span style="color:var(--muted)">${p.imported_wh>0?'grid':'solar'}</span>
      </div>`).join('');
    peakBody.innerHTML = peaks.length
      ? hdr + rows
      : '<div style="color:var(--muted);font-size:12px;padding:12px 4px;">No interval data yet</div>';
  }
}

async function renderIntervalDashboards(hasEV = true) {
  // Ensure DOM exists (built only once), then refresh charts
  const main = document.getElementById('main');
  // Move section to main if needed (loadDashboard rebuilds main.innerHTML)
  let sec = document.getElementById('interval-section');
  if (!sec || !main.contains(sec)) {
    _iDOMBuilt = false;
    if (sec) sec.remove();
  }
  _buildIntervalDOM(hasEV);
  _syncIntervalToggles();
  await _refreshIntervalCharts();
}

async function updateConflictBadge() {
  try {
    const s = await fetch('/api/settings').then(r => r.json());
    const badge = document.getElementById('conflict-badge');
    if (!badge) return;
    const n = s.conflict_count || 0;
    if (n > 0) {
      badge.textContent = n > 9 ? '9+' : n;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  } catch(_) {}
}

window.onerror = (msg, src, line, col, err) => {
  const main = document.getElementById('main');
  if (main && !main.querySelector('.chart-wrap')) {
    main.innerHTML = `<div class="empty-state"><div class="icon">⚠</div><h2>JS Error</h2>
      <p style="font-family:monospace;font-size:11px;color:var(--deficit);max-width:600px;word-break:break-all;">
      ${msg}<br>Line ${line}:${col}</p></div>`;
  }
  return false;
};
